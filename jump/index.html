<style>
/* Layout: one full-bleed white stage; title floats top-left, a single control rail sits at the bottom. */
:root{
  --paper:#ffffff;
  --ink:#1f2233;
  --muted:#8a8c9c;
  --rail:#f3f3f6;
  --line:#e4e4ea;
  --accent:#ff5a36;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;top:0;left:0;right:0;padding-top:20px;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));pointer-events:none}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(20px,3.2vw,30px);letter-spacing:-0.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:52ch;line-height:1.45}
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;
  background:var(--rail);border-radius:14px;padding:10px 16px;width:max-content;max-width:calc(100% - 32px)}
button{font:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,input:focus-visible+span,#skel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play svg{width:14px;height:14px;fill:currentColor}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input{width:110px;accent-color:var(--ink)}
.speed output{font-family:var(--mono);color:var(--ink);min-width:4ch;font-variant-numeric:tabular-nums}
.phases{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.02em;padding:6px 9px;border-radius:8px;color:var(--muted);transition:color .15s,background .15s}
.chip.on{background:var(--ink);color:var(--paper)}
.styles{display:flex;gap:4px;background:var(--paper);border-radius:10px;padding:3px}
.style{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 11px;border-radius:8px}
.style[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.style:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
header p.nav{display:block;margin-top:8px;pointer-events:auto}
header p.nav a{color:var(--ink);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line)}
header p.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.nav a,header p.nav span[aria-current]{display:inline-block;margin:0 12px 2px 0;white-space:nowrap}
header p.nav span[aria-current]{color:var(--ink);font-size:13px;font-weight:600}
.frame{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.frame b{color:var(--ink);font-weight:500}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog input{accent-color:var(--accent)}
@media (max-width:520px){.speed input{width:80px}.chip{padding:5px 6px;font-size:11px}header p{display:none}}

</style>

<body>
<div id="wrap">
  <canvas id="stage" aria-label="程序化跳躍動畫"></canvas>
  <header>
    <h1>Jump Study</h1>
    <p>原地反向跳與立定跳遠：真人動作捕捉（CMU，各 3 位演員），依測力板文獻的六個階段切分後平均。觸地時前腳掌釘在地上不滑動；騰空時重心只受重力，走 g = 9.81 m/s² 的拋物線；落地屈膝緩衝。</p>

  const B=body(t), ox=base-travel;                                     // drawing is relative to the travel point (the COM)
  const hip=[B.hip[0]+ox, B.hip[1]];
  const legs=[0,FAR].map(dx=>{ const ankle=[B.ankle[0]+ox+dx, B.ankle[1]], s=t-M.tTD;
    const imp = s>0 ? (s/0.018)*Math.exp(1-s/0.018) : 0;               // touchdown impulse (alpha function), drives the shoe squash
    return {hip, ankle, pitch:B.pitch, knee:ik(hip, ankle, LT, LS), imp}; });
  // trunk, head and arms: recorded jumps (lumbar = pelvis → mid-back, thorax = mid-back → neck, relative to quiet stance)
  const a2r=(val("thorax",t)+1.5)*D2R, a1=(val("lumbar",t)+1)*D2R;
  const P0=[hip[0], hip[1]+0.03], P1=add(P0,U(a1),0.28), C=add(P1,U(a2r),0.30);
  const ua=val("uarm",t), fa=val("farm",t), arm={ ua:ua*D2R, fl:Math.max(6,fa-ua)*D2R, shx:0, shy:0 };
  return {f:t, legs, tiltD:0, lean:a2r, a1, P0, P1, C, thr:0, head:val("head",t)*D2R, arms:[arm,arm], breath:0, com:[B.com[0]+ox, B.com[1]], ground:B.ground};
}
// combine rigid targets with spring state; step=true advances the springs by h seconds
// Body proportions (ANSUR II men; README "Proportions"). Leg length L = hip joint → ankle joint (thigh + shank = 1, ≈0.83 m).
// trunk: scales the torso landmarks along the spine (C7 at 0.744 L above the hip joint); neck: C7 → tragion rise (0.13 L = 108 mm);
// head: scales the drawn head (vertex–menton 0.28 L = 232 mm, head length 0.24 L).
const BODY={trunk:0.94, neck:0.13, head:1.05};
function compose(R, step, h){
  const mix=(kx,ky)=>(s,t)=>[t[0]+(s[0]-t[0])*kx, t[1]+(s[1]-t[1])*(ky??kx)];
  const cs = step? SPR.chest.step(R.C,h) : SPR.chest.get(R.C);
  let C = mix(0.2+0.2*EX, 1+0.6*EX)(cs,R.C);   // mostly the recorded trunk; only a little squash                 // vertical: squash/stretch; horizontal: only a hint of drag
  { const dd=sub(C,R.P1), aa=Math.atan2(dd[0],dd[1]), lim=1.8*D2R, ac=Math.max(R.lean-lim,Math.min(R.lean+lim,aa)), l=Math.hypot(dd[0],dd[1]);
    C=add(R.P1,U(ac),l); }                              // chest lags & overshoots the pelvis → squash/stretch
  const d=sub(C,R.P1), a2=Math.atan2(d[0],d[1]);
  const k=Math.hypot(C[0]-R.P0[0],C[1]-R.P0[1])/Math.hypot(R.C[0]-R.P0[0],R.C[1]-R.P0[1]), wsc=1/Math.sqrt(k); // stretch ⇒ thinner
  const tw=Math.sin(R.thr);                       // recorded trunk twist; exaggeration is for secondary motion only
  // spine = cubic Bézier pelvis → neck base; tangent gives the local "front" direction
  const B0=R.P0, B1=add(R.P0,U(R.a1),0.24), B3=add(C,U(a2),0.08), B2=add(C,U(a2),-0.18);
  const bz=s=>{ const m=1-s; return [m*m*m*B0[0]+3*m*m*s*B1[0]+3*m*s*s*B2[0]+s*s*s*B3[0], m*m*m*B0[1]+3*m*m*s*B1[1]+3*m*s*s*B2[1]+s*s*s*B3[1]]; };
  const bt=s=>{ const m=1-s; const x=3*m*m*(B1[0]-B0[0])+6*m*s*(B2[0]-B1[0])+3*s*s*(B3[0]-B2[0]), y=3*m*m*(B1[1]-B0[1])+6*m*s*(B2[1]-B1[1])+3*s*s*(B3[1]-B2[1]), l=Math.hypot(x,y)||1; return [x/l,y/l]; };
  const T=(r,u)=>{ u*=BODY.trunk; const s=Math.min(1,Math.max(0,u/0.66)), tg=bt(s); let p=bz(s); if(u>0.66) p=add(p,tg,u-0.66);
    const n=[tg[1],-tg[0]], th=(1+(wsc-1)*ss(s*1.6))*(1+(r>0?0.12:0.05)*Math.abs(tw));
    return add(p,n,r*th); };
  // arms; the shoulder girdle protracts/retracts with the swing and rides its own spring
  let shD=[0,0];
  const arms=R.arms.map((A,i)=>{ const side=i?-1:1;
    const ua0=step? SPR.ua[i].step([A.ua],h)[0] : SPR.ua[i].get([A.ua])[0];
    const fl0=step? SPR.fl[i].step([A.fl],h)[0] : SPR.fl[i].get([A.fl])[0];
    const ua=A.ua+(ua0-A.ua)*0.6*EX, fl=A.fl+(fl0-A.fl)*0.8*EX, fa=ua+fl;   // data already holds the real lag; springs add only cartoon drag
    const base=add(T(-0.04 + side*0.14*tw, 0.62),[0,0.004*R.breath]);
    const pro=A.shx, ele=A.shy;                              // shoulder-girdle offsets (zero here: the jump keeps the shoulders on the trunk)
    const tgt=add(add(base,FW(a2),pro),U(a2),ele);
    const sp=step? SPR.sh[i].step(tgt,h) : SPR.sh[i].get(tgt);
    const sh=[sp[0],sp[1]]; if(!i) shD=sub(sh,base);
    const el=[sh[0]+Math.sin(ua)*0.37, sh[1]-Math.cos(ua)*0.37], wr=[el[0]+Math.sin(fa)*0.31, el[1]-Math.cos(fa)*0.31];   // upper arm : forearm ≈ 1.27 (Winter 0.186H : 0.146H)
    return {sh,el,wr,ua,fa}; });
  // thighs push the shirt hem: front lifts over the forward thigh, back over the trailing one
  const thA=R.legs.map(L=>Math.atan2(L.knee[0]-L.hip[0], L.hip[1]-L.knee[1]));
  const pushF=0.07*Math.max(0,Math.sin(Math.max(...thA)))*(0.5+EX), pushB=0.045*Math.max(0,-Math.sin(Math.min(...thA)))*(0.5+EX);
  // ANSUR II (4,082 men) in leg-length units above the hip joint: C7 +0.744, ear (tragion) +0.874 (L = trochanterion − lateral malleolus).
    const neck=T(-0.11,0.76);                                   // C7 (back of the neck base)
  const CVA=60*D2R,   // upright end of the healthy range; matches the user's side-view reference
    earR=[neck[0]+BODY.neck/Math.tan(CVA), neck[1]+BODY.neck];   // C7 → tragion 0.13 L (ANSUR II); chin → sternal notch ≈0.10 L
  const headR=[earR[0]+0.035*BODY.head, earR[1]+0.005*BODY.head];                  // head centre sits just in front of/above the ear
  const hs = step? SPR.head.step(headR,h) : SPR.head.get(headR);
  let head = mix(0.05*EX, 0.15*EX)(hs,headR);   // the neck is stiff: the head follows the recorded trunk almost rigidly
  const nod = Math.max(-0.02,Math.min(0.02,-(head[1]-headR[1])*3));                   // chin dips as the head catches the body's fall
  const headAng=-R.head + nod*EX;
  { // the head nods about the top of the neck (atlas), and the cervical spine takes part of a downward look
    const down=Math.max(0,-headAng), hk=BODY.head, piv=[head[0]-0.01*hk+0.11*Math.sin(down*0.55), head[1]-0.09*hk-0.03*(1-Math.cos(down*0.55))];
    head=[piv[0]+(0.01*Math.cos(headAng)-0.09*Math.sin(headAng))*hk, piv[1]+(0.01*Math.sin(headAng)+0.09*Math.cos(headAng))*hk]; }
  const piv=add(head,[ -0.125*BODY.head*Math.sin(headAng), 0.125*BODY.head*Math.cos(headAng)]);   // quiff root
  const tipR=add(piv, [(0.1*Math.cos(headAng)-0.04*Math.sin(headAng))*BODY.head, (0.1*Math.sin(headAng)+0.04*Math.cos(headAng))*BODY.head]);
  const tp = step? SPR.hair.step(tipR,h) : SPR.hair.get(tipR);
  const v1=sub(tipR,piv), v2=sub(tp,piv);
  const hair=Math.max(-0.3,Math.min(0.3,(Math.atan2(v2[1],v2[0])-Math.atan2(v1[1],v1[0]))*(0.7+0.7*EX)));
  const hemR=T(0,0);
  const hm = step? SPR.hem.step([hemR[1]],h)[0] : SPR.hem.get([hemR[1]])[0];
  const hem=Math.max(-0.03,Math.min(0.03,(hm-hemR[1])*(1+3*EX)));
  // blink: eyes close for ~120 ms every few seconds
  let eye=1; const blk=simT-blinkAt; if(blk>0&&blk<0.13) eye=Math.abs(blk-0.065)/0.065;
  const shade=-0.085+0.16*tw;
  return {legs:R.legs, lean:a2, tiltD:R.tiltD, T, arms, neck, head, headAng, hair, hem, eye, shade, tw, pelvis:R.P0, shD, pushF, pushB};
}
function pose(f){ const R=kin(f), Q=compose(R,false); Q.com=R.com; Q.ground=R.ground; return Q; }

// ---------- drawing (world units, y up) ----------
const PAL = {
  skin:"#f2675a", skinD:"#d9534a", skinDD:"#c4473f",
  shirt:"#fdb14d", shirtD:"#e09a3b", shirtDD:"#cf8a30",
  pant:"#3f4f93", pantD:"#2e3a72", shoe:"#3d4c90", shoeD:"#2c3870", sole:"#22263a",
  hair:"#252a3d", face:"#2a2233"
};
const SHADOW = Object.fromEntries(Object.keys(PAL).map(k=>[k,"#000"]));

function smooth(ctx, pts){ // closed curve through edge midpoints, vertices as controls
  const n=pts.length, m=i=>{const a=pts[i%n],b=pts[(i+1)%n];return[(a[0]+b[0])/2,(a[1]+b[1])/2];};
  ctx.beginPath(); const s=m(n-1); ctx.moveTo(s[0],s[1]);
  for(let i=0;i<n;i++){ const p=pts[i], q=m(i); ctx.quadraticCurveTo(p[0],p[1],q[0],q[1]); }
  ctx.closePath();
}
function seg(ctx, pts, w, col, cap){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.lineWidth=w; ctx.strokeStyle=col; ctx.lineCap=cap||"round"; ctx.lineJoin="round"; ctx.stroke(); }
function disc(ctx,p,r,col){ ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2); ctx.fillStyle=col; ctx.fill(); }
function taper(ctx,p0,p1,w0,w1,col){ const dx=p1[0]-p0[0], dy=p1[1]-p0[1], l=Math.hypot(dx,dy)||1, nx=-dy/l, ny=dx/l;
  ctx.beginPath(); ctx.moveTo(p0[0]+nx*w0/2,p0[1]+ny*w0/2); ctx.lineTo(p1[0]+nx*w1/2,p1[1]+ny*w1/2); ctx.lineTo(p1[0]-nx*w1/2,p1[1]-ny*w1/2); ctx.lineTo(p0[0]-nx*w0/2,p0[1]-ny*w0/2); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];

function drawLeg(ctx, L, C, far){
  const pant = far?C.pantD:C.pant, skin = far?C.skinD:C.skin, shoe=far?C.shoeD:C.shoe;
  const cuff = lerp(L.knee, L.ankle, 0.9);
  seg(ctx,[cuff,[L.ankle[0],L.ankle[1]+0.005]],0.058,skin,"round");
  // shoe in foot frame
  const sq=1-0.16*EX*L.imp, F=v=>G.shoePt(L.ankle,L.pitch,[v[0]*(1+0.04*EX*L.imp), -0.07+(v[1]+0.07)*sq]);
  smooth(ctx,[[-0.08,-0.068],[0.21,-0.07],[0.262,-0.06],[0.25,-0.032],[0.19,-0.018],[0.09,0.008],[0.035,0.04],[-0.055,0.035],[-0.085,0.0]].map(F));
  ctx.fillStyle=shoe; ctx.fill();
  smooth(ctx,[[-0.085,-0.07],[0.24,-0.07],[0.262,-0.06],[0.255,-0.053],[-0.085,-0.054]].map(F));
  ctx.fillStyle=C.sole; ctx.fill();
  // pants: thigh + shin as two strokes, knee rounded
  disc(ctx,L.hip,0.12,pant);
  taper(ctx,L.hip,L.knee,0.24,0.16,pant);            // thigh girth ≈0.25 at the top (ANSUR), knee ≈0.15          // thigh: full at the hip, narrower at the knee
  disc(ctx,L.knee,0.08,pant);
  taper(ctx,L.knee,cuff,0.16,0.145,pant);
}
function drawArm(ctx, A, P, C, far){
  const skin=far?C.skinD:C.skin, shirt=far?C.shirtD:C.shirt;
  disc(ctx,A.sh,0.07,skin); taper(ctx,A.sh,A.el,0.14,0.1,skin); disc(ctx,A.el,0.049,skin); taper(ctx,A.el,A.wr,0.1,0.072,skin);   // ANSUR girths: upper arm ≈0.13, forearm ≈0.11, wrist ≈0.07
  const fd=[Math.sin(A.fa),-Math.cos(A.fa)];
  { const hcx=[A.wr[0]+fd[0]*0.068,A.wr[1]+fd[1]*0.068];   // relaxed hand along the forearm: wrist → fingertip 0.138 L (ANSUR hand length 0.23 L, fingers half-curled)
    ctx.beginPath(); ctx.ellipse(hcx[0],hcx[1],0.07,0.054,A.fa-Math.PI/2,0,Math.PI*2); ctx.fillStyle=skin; ctx.fill(); }
  if(!far){ const k=[A.wr[0]+fd[0]*0.035-Math.cos(A.fa)*0.025, A.wr[1]+fd[1]*0.035-Math.sin(A.fa)*0.025];
    seg(ctx,[k,[k[0]+fd[0]*0.04,k[1]+fd[1]*0.04]],0.008,C.skinDD,"round"); }

  const ax=[Math.sin(A.ua),-Math.cos(A.ua)], n=[Math.cos(A.ua),Math.sin(A.ua)];

  smooth(ctx,[p(-0.07,0.035),p(-0.02,0.09),p(0.18,0.085),p(0.185,-0.078),p(0.02,-0.095),p(-0.08,-0.055)]);
  ctx.fillStyle=shirt; ctx.fill();
  if(!far){ seg(ctx,[p(0.178,0.065),p(0.182,-0.06)],0.012,C.shirtDD,"round"); }
}
function drawFigure(ctx, Q, C){
  drawArm(ctx, Q.arms[1], Q, C, true);
  drawLeg(ctx, Q.legs[1], C, true);
  drawLeg(ctx, Q.legs[0], C, false);
  // pelvis: one rounded block inside the shirt's width — seat at the back, crotch line at the front
  { const T=Q.T, pts=[[-0.162,0.05],[0.148,0.05],[0.15,-0.03],[0.115,-0.095],[0.03,-0.125],[-0.08,-0.115],[-0.158,-0.07],[-0.172,0.0]].map(v=>T(v[0],v[1]));
    smooth(ctx,pts); ctx.fillStyle=C.pant; ctx.fill(); }
  // torso outline built from landmarks: spine curve × thickness profile, shoulder girdle, hem pushed by thighs
  const T=Q.T, hm=Q.hem, sd=Q.shD, w=u=>ss((u-0.4)/0.2)*(1-ss((u-0.64)/0.08));

  const P=(r,u)=>{ const p=T(r,u), k=w(u), kb=k*Math.max(0,Math.min(1,-r/0.12))*0.6; return [p[0]+sd[0]*kb, p[1]+sd[1]*kb*0.5]; };

  const back=[[0.756,-0.118],[0.72,-0.142],[0.66,-0.158],[0.56,-0.165],[0.42,-0.16],[0.3,-0.148],[0.18,-0.142],[0.06,-0.155],[0.0,-0.165-Q.pushB]];
  const body=[];
  body.push(P(-0.165-0.4*Math.abs(hm)-Q.pushB, hm*1.5));
  for(const [u,rr] of front) body.push(P(rr, u + (u<0.05? hm*0.7+Q.pushF*0.5 : 0)));
  body.push(P(0.075,0.66)); body.push(P(-0.02,0.718));   // front neckline at the sternal notch, collar rising to C7
  for(const [u,rr] of back) body.push(P(rr, u + (u<0.05? hm*1.2 : 0)));
  smooth(ctx,body); ctx.fillStyle=C.shirt; ctx.fill();
  ctx.save(); smooth(ctx,body); ctx.clip();
  ctx.beginPath(); [P(-0.45,-0.12),P(Q.shade+0.01,-0.12),P(Q.shade-0.01,0.25),P(Q.shade-0.03,0.5),P(Q.shade-0.05,0.85),P(-0.45,0.85)].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));

  // fold where the shirt drapes over the forward thigh
  if(Q.pushF>0.01){ const a=P(0.12,0.02), b=P(0.06,0.14); seg(ctx,[a,b],0.012,C.shirtD,"round"); }
  ctx.restore();

  { const ha=Q.headAng, Hd=Q.head, hk=BODY.head, hp=(x,y)=>[Hd[0]+(x*Math.cos(ha)-y*Math.sin(ha))*hk, Hd[1]+(x*Math.sin(ha)+y*Math.cos(ha))*hk];
    // inside back of the collar (fabric seen behind the neck)
    smooth(ctx,[P(-0.125,0.76),P(-0.07,0.775),P(0.02,0.712),P(-0.03,0.705)]); ctx.fillStyle=C.shirtDD; ctx.fill();
    const nb=P(-0.115,0.752), nf=P(0.07,0.662), tb=hp(-0.062,-0.045), tf=hp(0.035,-0.105);   // thick, near-vertical column (reference: depth ≈0.2 incl. trapezius)   // neck depth ≈0.17 at the base, ≈0.16 mid-neck (ANSUR II neck circumferences / π)
    smooth(ctx,[nb,lerp(nb,tb,0.5),tb,hp(-0.005,-0.1),tf,lerp(tf,nf,0.5),nf,P(-0.01,0.7)]); ctx.fillStyle=C.skin; ctx.fill();
    // soft shade under the jaw
    smooth(ctx,[hp(-0.015,-0.098),hp(0.035,-0.108),hp(0.02,-0.122),hp(-0.01,-0.118)]); ctx.fillStyle=C.skinD; ctx.fill();

    const c0=P(-0.125,0.76), cm=P(-0.02,0.722), c1=P(0.078,0.66);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(cm[0],cm[1],c1[0],c1[1]);

}
function drawHead(ctx,Q,C){
  ctx.save(); ctx.translate(Q.head[0],Q.head[1]); ctx.rotate(Q.headAng); ctx.scale(BODY.head,BODY.head);
  ctx.beginPath(); ctx.ellipse(0,0.005,0.112,0.135,0,0,Math.PI*2); ctx.fillStyle=C.skin; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.035,-0.06,0.08,0.065,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.035,-0.005,0.025,0.033,0,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill();
  // nose
  ctx.beginPath(); ctx.moveTo(0.108,0.015); ctx.quadraticCurveTo(0.14,-0.02,0.112,-0.03); ctx.fillStyle=C.skin; ctx.fill();
  // face
  // expression (FACS): happy = AU6 cheek raiser + AU12 lip-corner puller; sad = AU1+AU4 inner brow up/together + AU15 lip-corner depressor + drooping lid
  const E=expr(), hap=Math.max(0,E), sad=Math.max(0,-E);
  if(hap>0.01){ ctx.globalAlpha=hap*0.55; ctx.beginPath(); ctx.ellipse(0.062,-0.03,0.026,0.018,0.2,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill(); ctx.globalAlpha=1; }  // raised cheek
  const ry=0.011*Math.max(0.12,Q.eye)*(1-0.35*hap-0.4*sad);
  ctx.beginPath(); ctx.ellipse(0.075,0.02-0.002*hap,0.011,ry,0,0,Math.PI*2); ctx.fillStyle=C.face; ctx.fill();
  if(sad>0.01) seg(ctx,[[0.062,0.03+0.0],[0.088,0.026]],0.006*sad,C.face,"round");                       // heavy upper lid
  if(hap>0.01){ ctx.beginPath(); ctx.moveTo(0.062,0.006); ctx.quadraticCurveTo(0.076,0.0,0.09,0.008); ctx.lineWidth=0.005*hap; ctx.strokeStyle=C.skinDD; ctx.stroke(); } // lower lid pushed up
  // brow: front end is the inner (medial) end in profile
  seg(ctx,[[0.05,0.052+0.006*hap-0.004*sad],[0.098,0.046+0.008*hap+0.016*sad]],0.009,C.face,"round");
  // mouth: corner at the back, lips at the front

    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(0.083,-0.069-0.008*m,c1[0],c1[1]); ctx.lineWidth=0.007; ctx.strokeStyle=C.face; ctx.lineCap="round"; ctx.stroke(); }

  ctx.fillStyle=C.hair; ctx.fill();
  ctx.save(); ctx.translate(0.0,0.125); ctx.rotate(Q.hair);
  smooth(ctx,[[-0.07,0],[-0.02,0.04],[0.05,0.065],[0.115,0.055],[0.13,0.02],[0.11,-0.025],[0.06,-0.04]]); ctx.fill();   // short quiff: top ≈4 cm above the skull
  ctx.restore();
  ctx.restore();
}

const cv=document.getElementById("stage"), ctx=cv.getContext("2d");

const mk=document.createElement("canvas"), mx=mk.getContext("2d");
const lo=document.createElement("canvas"), lx=lo.getContext("2d");
let W=0,H=0,dpr=1,S=100,cx=0,gy=0,FX=0;   // FX: screen x of the middle of the fixed camera's frame
let KX=-0.62, KY=0.2, SH_A=1, SH_BLUR=1;   // shadow shear, darkness and softness (recomputed each frame)
// fixed camera: a point light hangs over the middle of the stage (height LH, a little behind the walker's line)
const LH=4.2, LZ=0.75;
function updateLight(){
  if(camMode!=="fixed"){ KX=-0.62; KY=0.2; SH_A=1; SH_BLUR=1; return; }
  const dx=(cx-W/2)/S, yRef=1.05;                       // horizontal offset from the light, in leg lengths
  KX=dx/(LH-yRef); KY=LZ/(LH-yRef);                      // shadow points away from the light, longer when farther
  const d=Math.hypot(dx,LH), c=LH/d;
  SH_A=Math.pow(c,3);                                    // irradiance ∝ cosθ/d²  → blocked light ∝ (h/d)³
  SH_BLUR=1+1.2*Math.abs(KX);                            // longer shadow → wider penumbra
}
let hasFilter=false;
try{ ctx.filter="blur(2px)"; hasFilter = ctx.filter==="blur(2px)"; ctx.filter="none"; }catch(e){}

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  for(const c of [cv,sc,mk]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  lo.width=Math.max(1,Math.round(W*dpr/5)); lo.height=Math.max(1,Math.round(H*dpr/5));
  const rr=document.querySelector(".rail").getBoundingClientRect(), railTop=rr.height? rr.top : H;   // keep the feet and shadow above the controls
  // a little smaller than the run: head room for the flight (hair top ≈2.55 leg lengths at the apex). Across, one broad jump
  // covers ≈2.05 leg lengths (take-off stance to landing), so the width allows more than on the other pages. On a narrow
  // screen the title sits over the figure: fit the apex between the title and the controls (2.55 + 0.3 below the floor).
  const hd=document.querySelector("header").getBoundingClientRect();
  S=Math.min(H*0.235, W*0.39, W<640 && hd.height? Math.min((railTop-hd.bottom-8)/2.9,(H*0.74-hd.bottom-8)/2.6) : Infinity);
  gy=Math.min(H*0.74, railTop-0.3*S);
  // fixed camera: the jump is framed in the middle, nudged right if the title text would sit over the take-off stance
  const tr=Math.max(0,...[...document.querySelectorAll("header h1, header p:not(.nav), header p.nav > *")].map(e=>{ const g=document.createRange(); g.selectNodeContents(e); const r=g.getBoundingClientRect(); return r.width? r.right : 0; }));
  FX=W*0.5+(W<640? 0 : Math.max(0, Math.min(tr+10-(W*0.5-0.75*S), W*0.5-1.15*S-10)));
}
addEventListener("resize",resize); resize();
if(document.fonts){ document.fonts.ready.then(resize); document.fonts.addEventListener?.("loadingdone",resize); }   // the title's size (and so the layout) changes once the web fonts arrive

let phase=0, travel=0, playing=true, speed=1, last=performance.now();
// camera: "fixed" keeps the world still from the countermovement to the landing, so planted feet stay planted and every
// push-off reads as acceleration. It frames one jump (take-off stance to landing, centred), and after a broad jump it
// glides on to the next one while the jumper absorbs the landing and stands (recovery + weighing), never mid-action.
let camMode="fixed", camX=null; const prints=[];
const span=m=>0.05+0.36*m.FD;                        // middle of the area one jump covers, from the take-off ball (leg lengths)
let pan={from:null, to:0, t0:0, dur:1};
function camGoal(){ const after=clock>=M.t0[6], m=after? GS[pending||style] : M; return (after? base+M.FD : base)+span(m); }
function camCentre(){ const u=Math.min(1,Math.max(0,(simT-pan.t0)/pan.dur)); return pan.from===null? pan.to : pan.from+(pan.to-pan.from)*u*u*u*(u*(6*u-15)+10); }
function glide(dur){ pan={from:camCentre(), to:camGoal(), t0:simT, dur:Math.max(1e-3,dur)}; }
function updateCamera(){
  if(camMode==="follow") camX=travel-(W*0.5)/S;
  else camX=camCentre()-FX/S;
  cx=S*(travel-camX);
}

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) playing=false;

function shoeLow(L){ let m=9;
  for(const v of [[-0.085,-0.07],[0.17,-0.07],[0.255,-0.07]]) m=Math.min(m,G.shoePt(L.ankle,L.pitch,v)[1]); return Math.max(0,m); }

// how far the COM is above its quiet-stance height (leg lengths)
const comStand=()=>groundAt(0.5,0).com[1];
function drawShadow(Q){
  // point light (fixed camera): a body lifted by h toward a light at height LH casts a shadow LH/(LH−h) times larger,
  // spread over a wider penumbra and fainter (same light / larger area). It shrinks back and sharpens on landing.
  const rise=Math.max(0,Q.com[1]-comStand()), m = camMode==="fixed" ? LH/(LH-rise) : 1, soft=1+2.5*rise;
  // 1) silhouette projected onto the ground plane (affine planar projection), scaled about the point under the COM
  const ax=dpr*(cx+S*(Q.com[0]+KX*Q.com[1])), ay=dpr*(gy+S*KY*Q.com[1]);
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  sx.translate(ax,ay); sx.scale(m,m); sx.translate(-ax,-ay);
  sx.transform(dpr*S,0,dpr*S*KX,dpr*S*KY,dpr*cx,dpr*gy);
  drawFigure(sx,Q,SHADOW);
  // 2) contact-hardening: sharp copy masked to fade with distance from the feet
  mx.setTransform(1,0,0,1,0,0); mx.globalCompositeOperation="source-over"; mx.clearRect(0,0,mk.width,mk.height);
  mx.drawImage(sc,0,0); mx.globalCompositeOperation="destination-in";
  const g=mx.createLinearGradient(dpr*cx,dpr*gy,dpr*(cx+S*KX*1.6),dpr*(gy+S*Math.max(KY,0.2)*1.6));
  g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.35,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  mx.fillStyle=g; mx.fillRect(0,0,mk.width,mk.height); mx.globalCompositeOperation="source-over";
  const A=SH_A/(m*m);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(hasFilter){ ctx.filter=`blur(${(S*0.045*dpr*SH_BLUR*soft).toFixed(1)}px)`; ctx.globalAlpha=0.2*A; ctx.drawImage(sc,0,0); ctx.filter="none"; }
  else { lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,lo.width,lo.height); lx.drawImage(sc,0,0,lo.width,lo.height);
    ctx.imageSmoothingQuality="high"; ctx.globalAlpha=0.15*A; ctx.drawImage(lo,0,0,cv.width,cv.height); }
  ctx.globalAlpha=0.16*A/(SH_BLUR*soft*soft); ctx.drawImage(mk,0,0);
  ctx.restore();
}
function drawContact(Q){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  // broad occlusion under the body: spreads and fades as the body rises
  const rise=Math.max(0,Q.com[1]-comStand());
  const spread=Math.abs(Q.legs[0].ankle[0]-Q.legs[1].ankle[0]);
  const bx=cx+S*(Q.com[0]+0.01), rw=S*(0.42+spread*0.55)*(1+1.2*rise), rh=S*0.05*(1+1.2*rise), a0=0.10*Math.exp(-rise/0.25);
  let g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(40,36,60,${a0.toFixed(3)})`); g.addColorStop(1,"rgba(40,36,60,0)");
  ctx.save(); ctx.translate(bx,gy+S*0.006); ctx.scale(rw,rh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  // per-foot contact shadow: tight & dark when planted, soft & faint as the foot lifts
  for(const L of Q.legs){
    const h=shoeLow(L), r=G.rot([0.09,0],L.pitch);
    const x=cx+S*(L.ankle[0]+r[0]), a=0.30*Math.exp(-h/0.05), w=S*(0.2+h*1.4)*(1+0.25*EX*L.imp), hh=S*(0.022+h*0.25);
    g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(30,28,48,${a.toFixed(3)})`); g.addColorStop(1,"rgba(30,28,48,0)");
    ctx.save(); ctx.translate(x,gy+S*0.004); ctx.scale(w,hh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
function drawGround(){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  if(camMode==="fixed"){   // the floor is brightest under the light and falls off as (h/d)³ toward the edges
    const R=Math.max(W,S*8), g=ctx.createRadialGradient(W/2,gy,0,W/2,gy,R);
    for(let i=0;i<=6;i++){ const t=i/6, dx=t*R/S, c=Math.pow(LH/Math.hypot(dx,LH),3); g.addColorStop(t,`rgba(31,34,51,${(0.07*(1-c)).toFixed(4)})`); }
    ctx.save(); ctx.beginPath(); ctx.rect(0,gy-S*0.02,W,H); ctx.clip();   // floor only, never the wall
    ctx.translate(0,gy); ctx.scale(1,0.18); ctx.translate(0,-gy); ctx.fillStyle=g; ctx.fillRect(0,gy-R,W,R*2); ctx.restore();
  }
  const sp=S*0.28, off=((-camX*S)%sp+sp)%sp;       // marks are fixed in the world
  for(let x=off-sp; x<W+sp; x+=sp){
    const e=Math.min(1, x/(W*0.12), (W-x)/(W*0.12)), a=Math.max(0,e)*0.16;
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.fillRect(x,gy+S*0.035,Math.max(1.5,S*0.04),1.5);
  }
  // footprints: where each foot was planted, fading over ~3 s
  for(let i=prints.length-1;i>=0;i--){ const p=prints[i], age=simT-p.t;
    if(age>3.2){ prints.splice(i,1); continue; }
    const x=S*(p.x-camX), y=gy+S*(p.near?0.022:-0.004), a=0.11*(1-age/3.2)*(p.near?1:0.6);
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(x+S*0.085,y,S*0.17,S*0.016,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawSkeleton(Q){
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  const w=1.6/S, ox=base-travel;
  // COM path of this jump: recorded chain on the ground, the ballistic parabola in the air
  ctx.strokeStyle="rgba(255,90,54,.55)"; ctx.lineWidth=w; ctx.setLineDash([4/S,4/S]);
  ctx.beginPath(); for(let i=0;i<=200;i++){ const t=M.TOT*i/200, B=body(t); i?ctx.lineTo(B.com[0]+ox,B.com[1]):ctx.moveTo(B.com[0]+ox,B.com[1]); } ctx.stroke();
  ctx.setLineDash([]);
  for(const [i,L] of Q.legs.entries()){ seg(ctx,[L.hip,L.knee,L.ankle],w*2,i?"rgba(255,90,54,.5)":"#ff5a36","round");
    disc(ctx,L.knee,0.018,"#ff5a36"); disc(ctx,L.ankle,0.015,"#ff5a36"); }
  for(const A of Q.arms){ seg(ctx,[A.sh,A.el,A.wr],w*1.6,"rgba(255,90,54,.7)","round"); }
  seg(ctx,[Q.pelvis,Q.neck],w*2,"#ff5a36","round");
  disc(ctx,Q.pelvis,0.024,"#1f2233");
  disc(ctx,Q.com,0.03,"#ff5a36"); disc(ctx,Q.com,0.012,"#ffffff");      // whole-body centre of mass
  ctx.restore();
  // COM height across the jump, current time marked: a small fixed panel in the top-right corner (below the title on a
  // narrow screen), so it never rides along with the figure or runs off the edge
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const pw=Math.min(240,W*0.3), ph=pw*0.36, hb=document.querySelector("header").getBoundingClientRect().bottom;
  const px=W-Math.max(16,Math.min(28,W*0.03))-pw, py=W<640? hb+10 : 28, n=160, ys=[];
  for(let i=0;i<=n;i++) ys.push(body(M.TOT*i/n).com[1]);
  const lo=Math.min(...ys), hi=Math.max(...ys), Y=v=>py+ph-(v-lo)/(hi-lo)*ph, X=t=>px+pw*t/M.TOT;
  ctx.fillStyle="rgba(31,34,51,.07)"; ctx.fillRect(X(M.tTO),py,X(M.tTD)-X(M.tTO),ph);      // flight
  ctx.strokeStyle="rgba(31,34,51,.4)"; ctx.lineWidth=1.25; ctx.lineJoin="round"; ctx.beginPath();
  ys.forEach((v,i)=>{ const x=px+pw*i/n; i?ctx.lineTo(x,Y(v)):ctx.moveTo(x,Y(v)); }); ctx.stroke();
  ctx.beginPath(); ctx.arc(X(clock),Y(body(clock).com[1]),3.5,0,TAU); ctx.fillStyle="#ff5a36"; ctx.fill();
  ctx.font="500 10px 'IBM Plex Mono', ui-monospace, monospace"; ctx.fillStyle="#8a8c9c"; ctx.textBaseline="bottom";
  ctx.fillText("COM 高度 height", px, py-3);
  ctx.restore();
}

// ---------- UI ----------
const chips=[...document.querySelectorAll(".chip")], fr=document.getElementById("fr");
const playBtn=document.getElementById("play"), ico=document.getElementById("ico");
const spd=document.getElementById("spd"), spdo=document.getElementById("spdo"), skel=document.getElementById("skel");
function setPlay(p){ playing=p; playBtn.setAttribute("aria-label",p?"暫停":"播放");
  ico.innerHTML = p? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>' : '<path d="M3 1 L13 7 L3 13 Z"/>'; last=performance.now(); }
playBtn.onclick=()=>setPlay(!playing);
spd.oninput=()=>{ speed=+spd.value; spdo.textContent=speed.toFixed(2)+"×"; };
addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); setPlay(!playing);} });
let lastKey="", lastFr=-1;
function phaseIdx(t){ let i=0; while(i<6 && t>=M.t0[i+1]) i++; return i; }
function updateUI(){
  const k=PH[phaseIdx(clock)];
  if(k!==lastKey){ chips.forEach(c=>c.classList.toggle("on",c.dataset.k===k)); lastKey=k; }
  const n=Math.floor(clock/M.TOT*24)%24+1; if(n!==lastFr){ fr.textContent=String(n).padStart(2,"0"); lastFr=n; }
}
if(reduce) setPlay(false);

let pending=null;
function useModel(k){ style=k; M=GS[k]; flightConsts(); }
const HSTEP=1/240; let accum=0;
function advance(dt){   // fixed-step simulation: the jump clock, travel and springs move together
  accum+=dt;
  while(accum>=HSTEP){ accum-=HSTEP; simT+=HSTEP;
    const prev=clock; clock+=HSTEP;
    if(prev<M.tTD && clock>=M.tTD) for(const dx of [0,FAR]) prints.push({x:base+M.FD+dx-BALL[0], t:simT, near:dx===0});
    if(prev<M.t0[6] && clock>=M.t0[6]) glide(M.TOT-clock+WEIGH-0.1);    // landed: frame the next jump while recovering and standing
    if(clock>=M.TOT){                                   // next jump starts where this one landed
      FROM=snapshot(M.TOT); clock-=M.TOT; base+=M.FD;
      if(pending){ useModel(pending); pending=null; glide(WEIGH-0.1-clock); } }
    travel=base+body(clock).com[0];
    compose(kin(clock), true, HSTEP);
    if(simT>blinkAt+0.2) blinkAt=simT+2+Math.random()*3.5;
  } }
const sty=document.getElementById("sty");
sty.oninput=()=>{ EX=+sty.value; };
const camBtns=[...document.querySelectorAll(".cam")];
camBtns.forEach(b=>b.onclick=()=>{ camMode=b.dataset.c; if(camMode==="fixed"){ pan={from:camX+FX/S, to:camGoal(), t0:simT, dur:0.8}; } camBtns.forEach(x=>x.setAttribute("aria-pressed",x===b)); });
const styleBtns=[...document.querySelectorAll(".style[data-s]")], src=document.getElementById("src");
function setSrc(k){ const J=JUMP[k], s=J.stats, m=GS[k];
  const what = k==="cmj" ? `${J.jumps} 次反向跳` : `${J.jumps} 次立定跳遠　距離 ${s.distance.toFixed(2)} m`;
  src.textContent = `CMU 動作捕捉 ${J.actors} 位演員 ${what}　騰空 ${Math.round(m.T*1000)} ms → 跳高 ${(GRAV*m.T*m.T/8*100).toFixed(1)} cm（gT²/8）　下蹲 ${Math.round(s.depth*100)} cm　膝屈 ${Math.round(s.knee_bottom)}°`; }
function setStyle(k){
  setSrc(k); styleBtns.forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===k));
  if(k===style){ pending=null; return; }
  if(clock<WEIGH){ FROM=snapshot(clock); clock=0; useModel(k); pending=null; glide(WEIGH-0.1); }   // still standing: switch now, settle into the new stance
  else{ pending=k; if(clock>=M.t0[6]) glide(M.TOT-clock+WEIGH-0.1); }          // mid-jump: finish this one first
}
styleBtns.forEach(b=>b.onclick=()=>setStyle(b.dataset.s));
setStyle("cmj"); travel=base+body(clock).com[0]; pan={from:null, to:camGoal(), t0:0, dur:1};
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing) advance(dt*speed);
  const Q=pose(clock);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  updateCamera(); updateLight(); drawGround(); drawShadow(Q); drawContact(Q);
  ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  drawFigure(ctx,Q,PAL);
  if(skel.checked) drawSkeleton(Q);
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
