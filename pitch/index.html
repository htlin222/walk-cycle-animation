<style>
/* Layout: one full-bleed white stage; title floats top-left, phase caption top-right, a single control rail at the bottom. */
:root{
  --paper:#ffffff;
  --ink:#1f2233;
  --muted:#8a8c9c;
  --rail:#f3f3f6;
  --line:#e4e4ea;
  --accent:#ff5a36;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;top:0;left:0;right:0;padding-top:20px;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));pointer-events:none}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(20px,3.2vw,30px);letter-spacing:-0.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:52ch;line-height:1.45}
header p.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;max-width:64ch}
header p.nav{display:block;margin-top:8px;pointer-events:auto}
header p.nav a{color:var(--ink);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line);margin-right:12px}
header p.nav a.lic{font-size:11px;color:var(--muted)}
header p.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.nav a,header p.nav span[aria-current]{display:inline-block;margin:0 12px 2px 0;white-space:nowrap}
header p.nav span[aria-current]{color:var(--ink);font-size:13px;font-weight:600}
#cap{position:absolute;top:20px;right:max(20px, env(safe-area-inset-right,0px));text-align:right;pointer-events:none;max-width:40ch}
#cap b{display:block;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(18px,2.6vw,26px)}
#cap span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
#cap i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink)}
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;
  background:var(--rail);border-radius:14px;padding:10px 16px;width:max-content;max-width:calc(100% - 32px)}
button{font:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
#play:focus-visible,input:focus-visible+span,#skel:focus-visible,.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play svg{width:14px;height:14px;fill:currentColor}
.step{width:30px;height:30px;border-radius:8px;border:0;background:var(--paper);color:var(--ink);font-size:13px}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input{width:100px;accent-color:var(--ink)}
.speed input#tl{width:150px}
.speed output{font-family:var(--mono);color:var(--ink);min-width:4ch;font-variant-numeric:tabular-nums}
.phases{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.chip{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.02em;padding:4px 7px;border-radius:8px;color:var(--muted);transition:color .15s,background .15s;text-align:center;line-height:1.15}
.chip small{display:block;font-weight:500;font-size:9.5px;letter-spacing:0}
.chip.on{background:var(--ink);color:var(--paper)}
.styles{display:flex;gap:4px;background:var(--paper);border-radius:10px;padding:3px}
.style{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 10px;border-radius:8px}
.style[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.style:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:12ch}
.frame b{color:var(--ink);font-weight:500}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog input{accent-color:var(--accent)}
@media (max-width:640px){.speed input{width:70px}.speed input#tl{width:90px}.chip{padding:3px 4px;font-size:11px}.chip small{display:none}header p{display:none}header p.nav{display:block}#cap span{display:none}}
</style>

</head>
<body>
<div id="wrap">
  <canvas id="stage" aria-label="程序化投球動畫"></canvas>
  <header>
    <h1>Pitch Study</h1>
    <p>直球：67 位投手、194 球的 3D 關節中心（Driveline OpenBiomechanics），在抬腿、膝蓋最高點、踏地、肩外旋最大、出手等事件之間對齊後平均，投影到側面、斜前或捕手視角。時間、球速與跨步都是實測值，著地的腳不滑步。</p>
    <p class="src" id="src"></p>
    <p class="nav"><a href="../">首頁 Home</a><a href="../walk/">走路 Walk</a><a href="../run/">跑步 Run</a><a href="../stand/">站立 Stand</a><a href="../stairs/">樓梯 Stairs</a><a href="../jump/">跳躍 Jump</a><a href="../dance/">舞蹈 Dance</a><span aria-current="page">投球 Pitch</span><a class="lic" href="https://www.openbiomechanics.org" rel="noopener">資料 Driveline OBP</a><a class="lic" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" rel="license noopener">CC BY-NC-SA 4.0</a></p>
  </header>
  <div id="cap" aria-live="polite"><b id="capT"></b><span id="capS"></span></div>
  <div class="rail">
    <button id="play" aria-label="暫停"><svg viewBox="0 0 14 14" id="ico"><rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/></svg></button>
    <button class="step" id="prev" aria-label="上一個事件">◀</button><button class="step" id="next" aria-label="下一個事件">▶</button>
    <div class="speed"><span>播放</span><input id="spd" type="range" min="0.02" max="1" step="0.01" value="0.25" aria-label="播放速度"><output id="spdo">0.25×</output></div>
    <div class="speed"><input id="tl" type="range" min="0" max="1000" step="1" value="0" aria-label="時間軸"></div>
    <div class="styles" role="group" aria-label="鏡頭"><button class="cam style" data-c="side" aria-pressed="true">側面</button><button class="cam style" data-c="q34" aria-pressed="false">斜前</button><button class="cam style" data-c="catcher" aria-pressed="false">捕手</button></div>
    <div class="phases" id="phases"></div>
    <span class="frame">t <b id="fr">0</b> ms</span>
    <label class="tog"><input id="skel" type="checkbox"><span>顯示骨架</span></label>
    <label class="tog"><input id="crv" type="checkbox" checked><span>曲線</span></label>
  </div>
</div>

  const rw=0.61/HM/2, rd=0.15/HM, ry=mc[1];
  const rb=[[xr-rd,ry-rw],[xr,ry-rw],[xr,ry+rw],[xr-rd,ry+rw]].map(([x,y])=>proj([x,y,0.004]));
  ctx.beginPath(); rb.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle="#ffffff"; ctx.fill();
  ctx.lineWidth=1.2/S; ctx.strokeStyle="rgba(31,34,51,.18)"; ctx.stroke();
  // direction of home plate
  const h0=proj([1.45,0.35,floorZ(1.45)]), h1=proj([1.75,0.35,floorZ(1.75)]);
  if(Math.hypot(h1[0]-h0[0],h1[1]-h0[1])>0.15){ seg(ctx,[h0,h1],1.5/S,"rgba(31,34,51,.25)");
    const a=Math.atan2(h1[1]-h0[1],h1[0]-h0[0]); seg(ctx,[[h1[0]-0.03*Math.cos(a-0.5),h1[1]-0.03*Math.sin(a-0.5)],h1,[h1[0]-0.03*Math.cos(a+0.5),h1[1]-0.03*Math.sin(a+0.5)]],1.5/S,"rgba(31,34,51,.25)");
    ctx.restore(); ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0); const s=toScreen(h1);
    ctx.font="12px "+getComputedStyle(document.body).fontFamily; ctx.fillStyle="rgba(31,34,51,.45)"; ctx.textAlign=h1[0]>h0[0]?"left":"right";
    ctx.fillText("本壘 Home", s[0]+(h1[0]>h0[0]?6:-6), s[1]+4); }
  ctx.restore();
}
function drawShadow(Q, ball){
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  sx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy);
  drawFigure(sx,Q,SHADOW,projShadow,ball);
  if(ball && ball.free){ const b=projShadow(ball.pos); disc(sx,b,0.02*b[3],"#000"); }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=0.16*fade;
  if(hasFilter) ctx.filter=`blur(${(S*0.02*dpr).toFixed(1)}px)`;
  ctx.drawImage(sc,0,0); ctx.filter="none"; ctx.restore();
  // contact shadows: tight and dark under a planted sole, soft and faint as it lifts
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy);
  for(const sd of ["rear","lead"]){ const m=lerp3(Q[sd+"_heel"],Q[sd+"_ball"],0.5), h=Math.max(0,Math.min(Q[sd+"_heel"][2],Q[sd+"_ball"][2])-floorZ(m[0]));
    const p=proj([m[0],m[1],floorZ(m[0])]), a=0.28*Math.exp(-h/0.03)*fade;
    const g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(30,28,48,${a.toFixed(3)})`); g.addColorStop(1,"rgba(30,28,48,0)");
    ctx.save(); ctx.translate(p[0],p[1]); ctx.scale((0.13+h)*p[3],(0.035+h*0.3)*p[3]); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,TAU); ctx.fill(); ctx.restore(); }
  ctx.restore();
}
function drawBall(ball){
  if(!ball || !ball.free) return;
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy);
  const tb=ball.tb;   // streak: where the ball was over the last 12 ms
  { const tt=Math.max(0,tb-0.012), q=proj([REL[0]+VB*Math.cos(LA)*tt, REL[1], REL[2]+VB*Math.sin(LA)*tt-GB*tt*tt/2]), p=proj(ball.pos);
    if(CAMD+q[2]>=1 && CAMD+p[2]>=1){ const g=ctx.createLinearGradient(q[0],q[1],p[0],p[1]); g.addColorStop(0,"rgba(31,34,51,0)"); g.addColorStop(1,"rgba(31,34,51,.18)");
      ctx.beginPath(); ctx.moveTo(q[0],q[1]); ctx.lineTo(p[0],p[1]); ctx.lineWidth=0.03*p[3]; ctx.lineCap="round"; ctx.strokeStyle=g; ctx.stroke(); } }
  const p=proj(ball.pos); if(CAMD+p[2]>=1){ disc(ctx,p,0.02*p[3],PAL.ball); ctx.lineWidth=1.2/S; ctx.strokeStyle="rgba(31,34,51,.35)"; ctx.stroke();
    seg(ctx,[[p[0]-0.01*p[3],p[1]+0.008*p[3]],[p[0]+0.01*p[3],p[1]-0.008*p[3]]],0.003*p[3],PAL.seam,"round"); }
  ctx.restore();
  // release speed label, fading over the first 1.5 s of real time (simT)
  const age=tb/Math.max(0.02,speed);
  if(age<1.5){ const a=Math.min(1,(1.5-age)/0.5), s=toScreen(proj(REL));
    ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.globalAlpha=a; ctx.fillStyle=getComputedStyle(document.body).getPropertyValue("--accent");
    ctx.font="600 13px "+getComputedStyle(document.body).fontFamily;
    const txt=`${D.ball.speed_mph.toFixed(1)} mph · ${(D.ball.speed_ms*3.6).toFixed(0)} km/h`, tw=ctx.measureText(txt).width;
    ctx.textAlign="left"; ctx.fillText(txt, s[0]+14+tw>W-8 ? s[0]-14-tw : s[0]+14, s[1]-14); ctx.restore(); }
}
function drawSkeleton(Q){
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy);
  const w=1.6/S, J=k=>proj(Q[k]);
  ctx.strokeStyle="rgba(255,90,54,.55)"; ctx.lineWidth=w; ctx.setLineDash([4/S,4/S]);
  ctx.beginPath(); for(let i=0;i<NS;i++){ const p=proj(D.pos.hand[i]); i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); } ctx.stroke();   // throwing-hand path
  ctx.setLineDash([]);
  for(const ch of [["rear_ankle","rear_knee","rear_hip","lead_hip","lead_knee","lead_ankle"],["pelvis","thorax_dist","thorax_prox"],
    ["hand","wrist","elbow","shoulder","thorax_prox","glove_shoulder","glove_elbow","glove_wrist","glove_hand"],["rear_heel","rear_ball"],["lead_heel","lead_ball"]])
    seg(ctx,ch.map(J),w*2,"#ff5a36","round");
  for(const k of ["rear_knee","lead_knee","rear_ankle","lead_ankle","elbow","wrist","glove_elbow","shoulder","glove_shoulder"]) disc(ctx,J(k),0.012,"#ff5a36");
  disc(ctx,J("com"),0.018,"#1f2233");
  ctx.restore();
}
// curves: pelvis and trunk rotation velocity, shoulder external rotation and elbow flexion, on the sample axis
// (piecewise time between events, so the fast part is readable); the current instant is marked
function drawCurves(t){
  const w=Math.min(300, W*0.36), h=52, x0=W-w-20, y0=(document.getElementById("cap").getBoundingClientRect().bottom||60)+26;
  if(W<640) return;
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font="10.5px "+getComputedStyle(document.body).fontFamily;
  const [ic,uc]=locate(t), xi=i=>x0+w*i/(NS-1), xc=xi(ic+uc);
  const panel=(y,series,max,unit)=>{
    ctx.strokeStyle="rgba(31,34,51,.12)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x0,y+h); ctx.lineTo(x0+w,y+h); ctx.stroke();
    for(const [name,col,lab] of series){ const a=D.angles[name]||D.velocities[name];
      ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath(); a.forEach((v,i)=>{ const yy=y+h-h*Math.max(0,v)/max; i?ctx.lineTo(xi(i),yy):ctx.moveTo(xi(i),yy); }); ctx.stroke();
      const v=curve(name,t); ctx.fillStyle=col; ctx.beginPath(); ctx.arc(xc,y+h-h*Math.max(0,v)/max,2.6,0,TAU); ctx.fill(); }
    ctx.textAlign="left"; let xx=x0; for(const [name,col,lab] of series){ const s=`${lab} ${Math.round(curve(name,t))}${unit}`; ctx.fillStyle=col; ctx.fillText(s, xx, y-4); xx+=ctx.measureText(s).width+12; } };
  panel(y0,[["pelvis_rotation_velocity","#3f4f93","骨盆 pelvis"],["trunk_rotation_velocity","#ff5a36","軀幹 trunk"]],1100," °/s");
  panel(y0+h+26,[["shoulder_external_rotation","#ff5a36","肩外旋 shoulder ER"],["elbow_flexion","#3f4f93","肘屈曲 elbow"]],180,"°");
  ctx.fillStyle="rgba(31,34,51,.45)"; ctx.textAlign="center";
  for(const [n,lab] of [["PKH","PKH"],["FC","FC"],["MER","MER"],["BR","BR"]]){ const x=xi(D.events.idx[D.events.names.indexOf(n)]);
    ctx.fillRect(x-0.5,y0,1,2*h+26); ctx.textAlign=n==="MER"?"right":n==="BR"?"left":"center"; ctx.fillText(lab,x+(n==="MER"?-2:n==="BR"?2:0),y0+2*h+38); }
  ctx.fillStyle="#1f2233"; ctx.fillRect(xc-0.5,y0,1,2*h+26);
  ctx.restore();
}

// ---------- UI ----------
const phasesEl=document.getElementById("phases");
phasesEl.innerHTML=PH.map(([k,zh,en])=>`<span class="chip" data-k="${k}">${zh}<small>${en}</small></span>`).join("");
const chips=[...document.querySelectorAll(".chip")], fr=document.getElementById("fr"), capT=document.getElementById("capT"), capS=document.getElementById("capS");
const playBtn=document.getElementById("play"), ico=document.getElementById("ico");
const spd=document.getElementById("spd"), spdo=document.getElementById("spdo"), skel=document.getElementById("skel"), crv=document.getElementById("crv"), tl=document.getElementById("tl");
function setPlay(p){ playing=p; playBtn.setAttribute("aria-label",p?"暫停":"播放");
  ico.innerHTML = p? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>' : '<path d="M3 1 L13 7 L3 13 Z"/>'; last=performance.now(); }
playBtn.onclick=()=>setPlay(!playing);
spd.oninput=()=>{ speed=+spd.value; spdo.textContent=speed.toFixed(2)+"×"; };
tl.oninput=()=>{ setPlay(false); seek(+tl.value/1000*CYCLE); };
function seek(t){ tau=Math.max(0,Math.min(CYCLE-1e-6,t)); SPR.hair.x=null; }
function step(dir){ setPlay(false); const e=1e-6;
  if(dir>0){ const n=STEPS.find(s=>s>tau+e); seek(n===undefined?0:n); }
  else { const p=[...STEPS].reverse().find(s=>s<tau-e); seek(p===undefined?STEPS[STEPS.length-1]:p); } }
document.getElementById("prev").onclick=()=>step(-1); document.getElementById("next").onclick=()=>step(1);
addEventListener("keydown",e=>{ if(e.target.tagName==="INPUT"&&e.target.type!=="checkbox") return;
  if(e.code==="Space"){ e.preventDefault(); setPlay(!playing);} else if(e.code==="ArrowRight"){ e.preventDefault(); step(1);} else if(e.code==="ArrowLeft"){ e.preventDefault(); step(-1);} });
const camBtns=[...document.querySelectorAll(".cam")];
camBtns.forEach(b=>b.onclick=()=>{ const v=VIEWS[b.dataset.c]; camAzT=v[0]*D2R; camElT=v[1]*D2R; camBtns.forEach(x=>x.setAttribute("aria-pressed",x===b)); });
const SU=D.summary, f0=x=>Math.round(x).toLocaleString("en-US"), ms=x=>Math.round(x);
const CAP={
  set:["預備 Set position", `投手板上的姿勢：抬腿開始那一刻（錄影從這附近開始）`],
  lift:["抬腿 Leg lift", `${ms((EV.PKH-EV.ON)*1000)} ms 到膝蓋最高點，軸心腳不動`],
  stride:["跨步 Stride", `跨步 ${(SU.stride_length_pct_height.mean*100).toFixed(0)}% 身高，重心朝本壘 ${SU.max_cog_velocity_x.mean.toFixed(1)} m/s；軸心腳出手前 ${-SU.pivot_drag_starts_ms} ms 開始拖行`],
  plant:["踏地 Foot plant", `前腳觸地（10% 體重）到全體重 ${ms((EV.FP-EV.FC)*1000)} ms，前腳落點低 ${SU.landing_drop_cm.toFixed(0)} cm（投手丘坡度）`],
  cock:["舉臂 Arm cocking", `骨盆 ${f0(SU.max_pelvis_rotation_velocity.mean)} °/s → 軀幹 ${f0(SU.max_trunk_rotation_velocity.mean)} °/s；肩外旋最大 ${SU.max_shoulder_external_rotation.mean.toFixed(0)}°`],
  accel:["加速 Arm acceleration", `肩外旋最大到出手只有 ${ms(-EV.MER*1000)} ms，肩內旋 ${f0(SU.max_shoulder_internal_rotation_velocity.mean)} °/s`],
  release:["出手 Release", `球速 ${D.ball.speed_mph.toFixed(1)} mph（${(D.ball.speed_ms*3.6).toFixed(0)} km/h），出手點高 ${SU.release_height_m.toFixed(2)} m`],
  follow:["跟進 Follow-through", `資料到出手後 ${ms(EV.END*1000)} ms 為止`],
  reset:["重置 Reset", `回到預備姿勢（淡出淡入，不是資料）`]};
let lastKey="", lastMs=null;
function updateUI(){
  const k=phaseAt(tau);
  if(k!==lastKey){ chips.forEach(c=>c.classList.toggle("on",c.dataset.k===k)); capT.textContent=CAP[k][0]; capS.textContent=CAP[k][1]; lastKey=k; }
  const m=Math.round(dataT(tau)*1000); if(m!==lastMs){ fr.textContent=(m>0?"+":"")+m; lastMs=m; }
  if(document.activeElement!==tl) tl.value=Math.round(tau/CYCLE*1000);
}
document.getElementById("src").textContent=`Driveline OBP：${D.pitchers} 位投手 ${D.pitches} 球（${D.lefties_mirrored} 位左投鏡像）· 身高 ${SU.height_m.mean.toFixed(2)} m · 球速 ${SU.pitch_speed_mph.mean.toFixed(1)} ± ${SU.pitch_speed_mph.sd.toFixed(1)} mph · 跨步 ${(SU.stride_length_pct_height.mean*100).toFixed(0)}% 身高 · 肩外旋 ${SU.max_shoulder_external_rotation.mean.toFixed(0)}° · 骨盆→軀幹角速度高峰相隔 ${SU.pelvis_to_trunk_peak_ms.mean.toFixed(0)} ms`;

const HSTEP=1/240; let accum=0;
const SWAP=SET+DATA+HOLD+FADE/2, shownTau=t=>t>=SWAP?0:t;   // second half of the reset shows the set pose
function advance(dt){   // fixed-step clock: loop time and the hair spring move together
  accum+=dt;
  while(accum>=HSTEP){ accum-=HSTEP; simT+=HSTEP; const prev=tau; tau+=HSTEP; if(tau>=CYCLE) tau-=CYCLE;
    if(prev<SWAP && tau>=SWAP) SPR.hair.x=null;   // the reset swaps the (invisible) finish for the set pose: the hair starts at rest
    const Q=poseAt(shownTau(tau)); SPR.hair.step(tuftAt(Q),HSTEP); } }
if(reduce) setPlay(false);
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing) advance(dt*speed);
  camAz+=(camAzT-camAz)*Math.min(1,dt*5); camEl+=(camElT-camEl)*Math.min(1,dt*5); setCam();
  const Q=poseAt(tau), ball=ballAt(tau);
  // reset: fade out the finished pose, fade the set position back in
  const tf=tau-(SET+DATA+HOLD); fade = tf<0?1 : tf<FADE/2? 1-tf/(FADE/2) : 0;
  const Qd = tf>=FADE/2 ? poseAt(0) : Q; if(tf>=FADE/2) fade=(tf-FADE/2)/(FADE/2);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  drawGround(); drawShadow(Qd, tf>=FADE/2?ballAt(0):ball);
  if(fade>=1){ ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy); drawFigure(ctx,Qd,PAL,proj,ball); ctx.restore(); }
  else { fx.setTransform(1,0,0,1,0,0); fx.clearRect(0,0,fc.width,fc.height); fx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*cy);
    drawFigure(fx,Qd,PAL,proj,tf>=FADE/2?ballAt(0):ball);
    ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=fade; ctx.drawImage(fc,0,0); ctx.restore(); }
  drawBall(ball);
  if(skel.checked) drawSkeleton(Qd);
  if(crv.checked) drawCurves(dataT(tau));
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
