/* Layout: one full-bleed white stage; title floats top-left, a single control rail sits at the bottom. */
:root{
  --paper:#ffffff;
  --ink:#1f2233;
  --muted:#8a8c9c;
  --rail:#f3f3f6;
  --line:#e4e4ea;
  --accent:#ff5a36;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;top:0;left:0;right:0;padding-top:20px;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));pointer-events:none}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(20px,3.2vw,30px);letter-spacing:-0.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:52ch;line-height:1.45}
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;
  background:var(--rail);border-radius:14px;padding:10px 16px;width:max-content;max-width:calc(100% - 32px)}
button{font:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,input:focus-visible+span,#skel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play svg{width:14px;height:14px;fill:currentColor}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input{width:110px;accent-color:var(--ink)}
.speed output{font-family:var(--mono);color:var(--ink);min-width:4ch;font-variant-numeric:tabular-nums}
.phases{display:flex;gap:4px}
.chip{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.02em;padding:6px 9px;border-radius:8px;color:var(--muted);transition:color .15s,background .15s}
.chip.on{background:var(--ink);color:var(--paper)}
.styles{display:flex;gap:4px;background:var(--paper);border-radius:10px;padding:3px}
.style{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 11px;border-radius:8px}
.style[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.style:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
header p.nav{display:block;margin-top:8px;pointer-events:auto}
header p.nav a{color:var(--ink);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line)}
header p.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.nav a,header p.nav span[aria-current]{display:inline-block;margin:0 12px 2px 0;white-space:nowrap}
header p.nav span[aria-current]{color:var(--ink);font-size:13px;font-weight:600}
.frame{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.frame b{color:var(--ink);font-weight:500}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog input{accent-color:var(--accent)}
@media (max-width:520px){.speed input{width:80px}.chip{padding:5px 6px;font-size:11px}header p{display:none}}
.beatchip{min-width:26px;text-align:center}
#click[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
</style>

    <h1>Dance Cycle Study</h1>
    <p>CMU 真人舞蹈動作捕捉：查爾斯頓、騷莎、印度舞。節拍由動作本身量出（骨盆上下彈動與腳步週期），把重複的小節對齊後平均，接地的腳鎖在地上不滑動。</p>

  </div>
</div>

    smooth(ctx,[hp(-0.015,-0.098),hp(0.035,-0.108),hp(0.02,-0.122),hp(-0.01,-0.118)]); ctx.fillStyle=C.skinD; ctx.fill();
    // rib collar: a band running from high at the back of the neck down to the sternal notch
    const c0=P(-0.125,0.76), cm=P(-0.02,0.738), c1=P(0.078,0.69);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(cm[0],cm[1],c1[0],c1[1]);
    ctx.lineWidth=0.026; ctx.strokeStyle=C.shirt; ctx.lineCap="round"; ctx.stroke();
    ctx.lineWidth=0.007; ctx.strokeStyle=C.shirtDD; ctx.stroke();
  }
  drawHead(ctx,Q,C);
  drawArm(ctx, Q.arms[0], Q, C, false);
}
function drawHead(ctx,Q,C){
  ctx.save(); ctx.translate(Q.head[0],Q.head[1]); ctx.rotate(Q.headAng);
  ctx.beginPath(); ctx.ellipse(0,0.005,0.112,0.135,0,0,Math.PI*2); ctx.fillStyle=C.skin; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.035,-0.06,0.08,0.065,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.035,-0.005,0.025,0.033,0,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill();
  // nose
  ctx.beginPath(); ctx.moveTo(0.108,0.015); ctx.quadraticCurveTo(0.14,-0.02,0.112,-0.03); ctx.fillStyle=C.skin; ctx.fill();
  // face
  // expression (FACS): happy = AU6 cheek raiser + AU12 lip-corner puller; sad = AU1+AU4 inner brow up/together + AU15 lip-corner depressor + drooping lid
  const E=expr(), hap=Math.max(0,E), sad=Math.max(0,-E);
  if(hap>0.01){ ctx.globalAlpha=hap*0.55; ctx.beginPath(); ctx.ellipse(0.062,-0.03,0.026,0.018,0.2,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill(); ctx.globalAlpha=1; }  // raised cheek
  const ry=0.011*Math.max(0.12,Q.eye)*(1-0.35*hap-0.4*sad);
  ctx.beginPath(); ctx.ellipse(0.075,0.02-0.002*hap,0.011,ry,0,0,Math.PI*2); ctx.fillStyle=C.face; ctx.fill();
  if(sad>0.01) seg(ctx,[[0.062,0.03+0.0],[0.088,0.026]],0.006*sad,C.face,"round");                       // heavy upper lid
  if(hap>0.01){ ctx.beginPath(); ctx.moveTo(0.062,0.006); ctx.quadraticCurveTo(0.076,0.0,0.09,0.008); ctx.lineWidth=0.005*hap; ctx.strokeStyle=C.skinDD; ctx.stroke(); } // lower lid pushed up
  // brow: front end is the inner (medial) end in profile
  seg(ctx,[[0.05,0.052+0.006*hap-0.004*sad],[0.098,0.046+0.008*hap+0.016*sad]],0.009,C.face,"round");
  // mouth: corner at the back, lips at the front
  { const m=hap-sad, c0=[0.066,-0.067+0.014*m], c1=[0.1,-0.066];
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(0.083,-0.069-0.008*m,c1[0],c1[1]); ctx.lineWidth=0.007; ctx.strokeStyle=C.face; ctx.lineCap="round"; ctx.stroke(); }
  // hair cap + quiff (quiff swings with vertical acceleration)
  smooth(ctx,[[0.11,0.06],[0.09,0.13],[0.0,0.16],[-0.1,0.13],[-0.128,0.05],[-0.105,0.0],[-0.07,0.02],[-0.05,0.055],[0.04,0.07]]);   // hairline above the nape
  ctx.fillStyle=C.hair; ctx.fill();
  ctx.save(); ctx.translate(0.0,0.13); ctx.rotate(Q.hair);
  smooth(ctx,[[-0.08,0.0],[-0.02,0.11],[0.09,0.16],[0.15,0.1],[0.13,0.03],[0.07,-0.02]]); ctx.fill();
  ctx.restore();
  ctx.restore();
}


// ---------- stage ----------
const cv=document.getElementById("stage"), ctx=cv.getContext("2d");
const sc=document.createElement("canvas"), sx=sc.getContext("2d");
const mk=document.createElement("canvas"), mx=mk.getContext("2d");
const lo=document.createElement("canvas"), lx=lo.getContext("2d");
let W=0,H=0,dpr=1,S=100,cx=0,gy=0;
// the dancer stays in place: a fixed camera, one key light up front-right, as in the run page's follow view
const KX=-0.62, KY=0.2, SH_A=1, SH_BLUR=1, camMode="follow";
let hasFilter=false;
try{ ctx.filter="blur(2px)"; hasFilter = ctx.filter==="blur(2px)"; ctx.filter="none"; }catch(e){}

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  for(const c of [cv,sc,mk]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  lo.width=Math.max(1,Math.round(W*dpr/5)); lo.height=Math.max(1,Math.round(H*dpr/5));
  S=Math.min(H*0.235, W*0.31);                              // a little smaller than run/: dancers stand taller (pelvis ≈1.1 leg lengths) and raise their arms
  const rr=document.querySelector(".rail").getBoundingClientRect(), railTop=rr.height? rr.top : H;   // keep the feet and shadow above the controls
  gy=Math.min(H*0.74, railTop-0.3*S);
  cx=W*0.5; camX=-cx/S;
}
let phase=0, playing=true, speed=1, last=performance.now(), camX=0, cycles=0;
const prints=[];
addEventListener("resize",resize); resize();

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) playing=false;

function shoeLow(L){ let m=9;
  for(const v of [[-0.085,-0.07],[0.17,-0.07],[0.255,-0.07]]) m=Math.min(m,G.shoePt(L.ankle,L.pitch,v)[1]); return Math.max(0,m); }

function drawShadow(Q){
  // 1) silhouette projected onto the ground plane (affine planar projection)
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  sx.setTransform(dpr*S,0,dpr*S*KX,dpr*S*KY,dpr*cx,dpr*gy);
  drawFigure(sx,Q,SHADOW);
  // 2) contact-hardening: sharp copy masked to fade with distance from the feet
  mx.setTransform(1,0,0,1,0,0); mx.globalCompositeOperation="source-over"; mx.clearRect(0,0,mk.width,mk.height);
  mx.drawImage(sc,0,0); mx.globalCompositeOperation="destination-in";
  const g=mx.createLinearGradient(dpr*cx,dpr*gy,dpr*(cx+S*KX*1.6),dpr*(gy+S*Math.max(KY,0.2)*1.6));
  g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.35,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  mx.fillStyle=g; mx.fillRect(0,0,mk.width,mk.height); mx.globalCompositeOperation="source-over";
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(hasFilter){ ctx.filter=`blur(${(S*0.045*dpr*SH_BLUR).toFixed(1)}px)`; ctx.globalAlpha=0.2*SH_A; ctx.drawImage(sc,0,0); ctx.filter="none"; }
  else { lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,lo.width,lo.height); lx.drawImage(sc,0,0,lo.width,lo.height);
    ctx.imageSmoothingQuality="high"; ctx.globalAlpha=0.15*SH_A; ctx.drawImage(lo,0,0,cv.width,cv.height); }
  ctx.globalAlpha=0.16*SH_A/SH_BLUR; ctx.drawImage(mk,0,0);
  ctx.restore();
}
function drawContact(Q){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  // broad occlusion under the body, widens with the stride spread
  const spread=Math.abs(Q.legs[0].ankle[0]-Q.legs[1].ankle[0]);
  const bx=cx+S*((Q.legs[0].ankle[0]+Q.legs[1].ankle[0])/2+0.06-0.05), rw=S*(0.42+spread*0.55), rh=S*0.05;
  let g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,"rgba(40,36,60,.10)"); g.addColorStop(1,"rgba(40,36,60,0)");
  ctx.save(); ctx.translate(bx,gy+S*0.006); ctx.scale(rw,rh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  // per-foot contact shadow: tight & dark when planted, soft & faint as the foot lifts
  for(const L of Q.legs){
    const h=shoeLow(L), r=G.rot([0.09,0],L.pitch);
    const x=cx+S*(L.ankle[0]+r[0]), a=0.30*Math.exp(-h/0.05), w=S*(0.2+h*1.4)*(1+0.25*EX*L.imp), hh=S*(0.022+h*0.25);
    g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(30,28,48,${a.toFixed(3)})`); g.addColorStop(1,"rgba(30,28,48,0)");
    ctx.save(); ctx.translate(x,gy+S*0.004); ctx.scale(w,hh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
function drawGround(){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  if(camMode==="fixed"){   // the floor is brightest under the light and falls off as (h/d)³ toward the edges
    const R=Math.max(W,S*8), g=ctx.createRadialGradient(W/2,gy,0,W/2,gy,R);
    for(let i=0;i<=6;i++){ const t=i/6, dx=t*R/S, c=Math.pow(LH/Math.hypot(dx,LH),3); g.addColorStop(t,`rgba(31,34,51,${(0.07*(1-c)).toFixed(4)})`); }
    ctx.save(); ctx.beginPath(); ctx.rect(0,gy-S*0.02,W,H); ctx.clip();   // floor only, never the wall
    ctx.translate(0,gy); ctx.scale(1,0.18); ctx.translate(0,-gy); ctx.fillStyle=g; ctx.fillRect(0,gy-R,W,R*2); ctx.restore();
  }
  const sp=S*0.28, off=((-camX*S)%sp+sp)%sp;       // marks are fixed in the world
  for(let x=off-sp; x<W+sp; x+=sp){
    const e=Math.min(1, x/(W*0.12), (W-x)/(W*0.12)), a=Math.max(0,e)*0.16;
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.fillRect(x,gy+S*0.035,Math.max(1.5,S*0.04),1.5);
  }
  // footprints: where each foot was planted, fading over ~3 s
  for(let i=prints.length-1;i>=0;i--){ const p=prints[i], age=simT-p.t;
    if(age>3.2){ prints.splice(i,1); continue; }
    const x=S*(p.x-camX), y=gy+S*(p.near?0.022:-0.004), a=0.11*(1-age/3.2)*(p.near?1:0.6);
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(x+S*0.085,y,S*0.17,S*0.016,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawSkeleton(Q){
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  const w=1.6/S;
  // ankle paths over one cycle; planted stretches drawn solid
  for(const i of [0,1]){ ctx.strokeStyle=i?"rgba(255,90,54,.35)":"rgba(255,90,54,.6)"; ctx.lineWidth=w;
    for(let k=0;k<240;k++){ const f0=k/240, f1=(k+1)/240, a=cur(c=>c.legs[i].ankle,f0), b=cur(c=>c.legs[i].ankle,f1);
      ctx.setLineDash(contactAt(i,f0)?[]:[4/S,4/S]); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); } }
  ctx.setLineDash([]);
  for(const [i,L] of Q.legs.entries()){ seg(ctx,[L.hip,L.knee,L.ankle],w*2,i?"rgba(255,90,54,.5)":"#ff5a36","round");
    disc(ctx,L.knee,0.018,"#ff5a36"); disc(ctx,L.ankle,0.015,"#ff5a36"); }
  for(const A of Q.arms){ seg(ctx,[A.sh,A.el,A.wr],w*1.6,"rgba(255,90,54,.7)","round"); }
  seg(ctx,[Q.pelvis,Q.neck],w*2,"#ff5a36","round");
  disc(ctx,Q.pelvis,0.024,"#1f2233");
  // pelvis height across the cycle with the beats marked: the bounce is what sets the beat
  const y0=2.45, yk=6, hm=meanOf(DANCE[styleB].curves.pel.map(p=>p[1]));
  ctx.strokeStyle="rgba(31,34,51,.35)"; ctx.lineWidth=w; ctx.beginPath();
  for(let i=0;i<=160;i++){ const f=i/160, x=-0.9+1.8*f, y=y0+(cur(c=>c.pel,f)[1]-hm)*yk; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke();
  const nb=beatsB(); for(let b=0;b<nb;b++) disc(ctx,[-0.9+1.8*b/nb, y0-0.09],0.012,"rgba(31,34,51,.45)");
  disc(ctx,[-0.9+1.8*phase, y0+(cur(c=>c.pel,phase)[1]-hm)*yk],0.022,"#ff5a36");
  ctx.restore();
}

// ---------- metronome: WebAudio click on every measured beat (accent on beat 1), off by default ----------
let AC=null, clickOn=false, nextBeat=null, clickNb=0;
function click(when, accent){
  const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=accent?1760:1175;
  g.gain.setValueAtTime(0.0001,when); g.gain.exponentialRampToValueAtTime(accent?0.5:0.3,when+0.002); g.gain.exponentialRampToValueAtTime(0.0001,when+0.05);
  o.connect(g).connect(AC.destination); o.start(when); o.stop(when+0.06); }
function scheduleClicks(){   // look ahead 120 ms from the animation's own clock, so clicks land on the drawn beat
  if(!clickOn||!AC||!playing) { nextBeat=null; return; }
  const nb=beatsB(), pos=(cycles+phase)*nb, rate=rateB()*nb*speed;            // beats elapsed, beats per second
  // a cross-fade between styles changes the beats per cycle half-way: re-count, or a style with fewer beats falls silent
  if(nextBeat===null||nextBeat<pos||nb!==clickNb){ nextBeat=Math.ceil(pos); clickNb=nb; }
  const lat=AC.outputLatency||AC.baseLatency||0;                                 // heard when drawn: start early by the output latency
  while((nextBeat-pos)/rate<0.12){ click(Math.max(AC.currentTime, AC.currentTime+(nextBeat-pos)/rate-lat), nextBeat%nb===0); nextBeat++; } }

// ---------- UI ----------
const chipBox=document.getElementById("phases"), bpmEl=document.getElementById("bpm");
const playBtn=document.getElementById("play"), ico=document.getElementById("ico");
const spd=document.getElementById("spd"), spdo=document.getElementById("spdo"), skel=document.getElementById("skel");
const clickBtn=document.getElementById("click");
function setPlay(p){ playing=p; playBtn.setAttribute("aria-label",p?"暫停":"播放");
  ico.innerHTML = p? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>' : '<path d="M3 1 L13 7 L3 13 Z"/>'; last=performance.now(); nextBeat=null; }
playBtn.onclick=()=>setPlay(!playing);
spd.oninput=()=>{ speed=+spd.value; spdo.textContent=speed.toFixed(2)+"×"; nextBeat=null; };
clickBtn.onclick=()=>{ clickOn=!clickOn; clickBtn.setAttribute("aria-pressed",clickOn);
  if(clickOn){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume(); }catch(e){ clickOn=false; clickBtn.setAttribute("aria-pressed",false); } }
  nextBeat=null; };
addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"&&e.target.tagName!=="BUTTON"){ e.preventDefault(); setPlay(!playing);} });
let chips=[], lastBeat=-1, chipStyle="";
function buildChips(){ const nb=DANCE[styleB].beats; chipStyle=styleB+nb;
  chipBox.innerHTML=Array.from({length:nb},(_,i)=>`<span class="chip beatchip" data-k="${i}">${i+1}</span>`).join(""); chips=[...chipBox.children]; lastBeat=-1; }
function updateUI(){
  if(chipStyle!==styleB+DANCE[styleB].beats) buildChips();
  const b=Math.floor(G.mod1(phase)*DANCE[styleB].beats);
  if(b!==lastBeat){ chips.forEach((c,i)=>c.classList.toggle("on",i===b)); lastBeat=b; }
}
if(reduce) setPlay(false);

const HSTEP=1/240; let accum=0;
function advance(dt){   // fixed-step simulation: phase and springs move together; the dancer stays in place
  accum+=dt;
  while(accum>=HSTEP){ accum-=HSTEP; simT+=HSTEP;
    const f0=phase, d=HSTEP*rateB(); phase=G.mod1(phase+d); if(phase<f0) cycles++;
    if(blend<1) blend=Math.min(1,blend+HSTEP/0.9);
    for(const i of [0,1]) if(contactAt(i,phase) && !contactAt(i,f0)){ const L=legAt(i,phase); prints.push({x:L.ankle[0], t:simT, near:i===0}); }
    compose(kin(phase), true, HSTEP);
    if(simT>blinkAt+0.2) blinkAt=simT+2+Math.random()*3.5;
  } }
const sty=document.getElementById("sty");
sty.oninput=()=>{ EX=+sty.value; };
const styleBtns=[...document.querySelectorAll(".style[data-s]")], src=document.getElementById("src");
const STYLE_NAMES={charleston:"查爾斯頓",salsa:"騷莎",indian:"印度舞"};
function setSrc(k){ const s=DANCE[k], subj=[...new Set(s.clips.map(c=>c.clip.split("_")[0]))].join(" / ");
  bpmEl.textContent=s.bpm.toFixed(0);
  src.textContent = `CMU 受試者 ${subj}：${s.cycles} 個循環平均　${s.bpm.toFixed(0)} BPM（骨盆彈動）　每循環 ${s.beats} 拍 ${s.cycle_s.toFixed(2)} s　落腳 ${s.touchdown_hz.toFixed(2)} 次/秒　鏡頭由側面轉 ${s.view_deg}°`; }
function setStyle(k){
  setSrc(k);
  if(k===styleB && blend>=1) return;
  styleA = blend>=0.5 ? styleB : styleA; styleB=k; blend=0; nextBeat=null;      // cross-fade from whatever is showing
  styleBtns.forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===k));
}
styleBtns.forEach(b=>b.onclick=()=>setStyle(b.dataset.s));
setStyle("charleston"); blend=1;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing) advance(dt*speed);
  scheduleClicks();
  const Q=pose(phase);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  drawGround(); drawShadow(Q); drawContact(Q);
  ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  drawFigure(ctx,Q,PAL);
  if(skel.checked) drawSkeleton(Q);
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
