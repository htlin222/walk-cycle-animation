<style>
/* Layout: one full-bleed white stage; title floats top-left, a single control rail sits at the bottom. */
:root{
  --paper:#ffffff;
  --ink:#1f2233;
  --muted:#8a8c9c;
  --rail:#f3f3f6;
  --line:#e4e4ea;
  --accent:#ff5a36;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Archivo", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
header{position:absolute;top:0;left:0;right:0;padding-top:20px;
  padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px));pointer-events:none}
h1{margin:0;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:clamp(20px,3.2vw,30px);letter-spacing:-0.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:52ch;line-height:1.45}
.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 18px;
  background:var(--rail);border-radius:14px;padding:10px 16px;width:max-content;max-width:calc(100% - 32px)}
button{font:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,input:focus-visible+span,#skel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play svg{width:14px;height:14px;fill:currentColor}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.speed input{width:110px;accent-color:var(--ink)}
.speed output{font-family:var(--mono);color:var(--ink);min-width:4ch;font-variant-numeric:tabular-nums}
.phases{display:flex;gap:4px}
.chip{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:12px;letter-spacing:.02em;padding:6px 9px;border-radius:8px;color:var(--muted);transition:color .15s,background .15s}
.chip.on{background:var(--ink);color:var(--paper)}
.styles{display:flex;flex-wrap:wrap;gap:4px;background:var(--paper);border-radius:10px;padding:3px}
.style{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 11px;border-radius:8px}
.style[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.style:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header p.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
header p.nav{display:block;margin-top:8px;pointer-events:auto}
header p.nav a{color:var(--ink);font-size:13px;text-decoration:none;border-bottom:1px solid var(--line)}
header p.nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.frame b{color:var(--ink);font-weight:500}
label.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
label.tog input{accent-color:var(--accent)}
@media (max-width:520px){.speed input{width:80px}.chip{padding:5px 6px;font-size:11px}header p{display:none}.style{padding:5px 8px;font-size:12px}}
</style>

</head>
<body>
<div id="wrap">
  <canvas id="stage" aria-label="程序化上下樓梯與斜坡步行動畫"></canvas>
  <header>
    <h1>Stairs &amp; Ramps Study</h1>
    <p>腿與骨盆：22 位成人上下樓梯（4 種階高）與斜坡（6 種坡度）的實測步態（Camargo et al. 2021）。站立腳不滑動、踩在踏面上，身體高度跟著地形走；樓梯無限延伸。上半身：真人走路動作捕捉，軀幹依實測骨盆前傾調整。</p>
    <p class="src" id="src"></p>
    <p class="nav"><a href="../">← 走路 Walk</a></p>
  </header>
  <div class="rail">
    <button id="play" aria-label="暫停"><svg viewBox="0 0 14 14" id="ico"><rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/></svg></button>
    <div class="speed"><span>播放</span><input id="spd" type="range" min="0.1" max="1.5" step="0.05" value="1" aria-label="播放速度"><output id="spdo">1.00×</output></div>
    <div class="styles" role="group" aria-label="地形與方向"><button class="style mode" data-m="stair_ascent" aria-pressed="true">上樓 ↗</button><button class="style mode" data-m="stair_descent" aria-pressed="false">下樓 ↘</button><button class="style mode" data-m="ramp_ascent" aria-pressed="false">上坡 ↗</button><button class="style mode" data-m="ramp_descent" aria-pressed="false">下坡 ↘</button></div>
    <div class="styles" role="group" aria-label="階高或坡度" id="conds"></div>
    <div class="speed"><span>誇張</span><input id="sty" type="range" min="0" max="1" step="0.05" value="0.5" aria-label="表演誇張程度"></div>
    <div class="phases" id="phases">
      <span class="chip" data-k="contact">Contact</span><span class="chip" data-k="mid">Mid-stance</span><span class="chip" data-k="toeoff">Toe-off</span><span class="chip" data-k="swing">Swing</span>
    </div>
    <span class="frame">frame <b id="fr">01</b> / 24</span>
    <label class="tog"><input id="skel" type="checkbox"><span>顯示骨架</span></label>
  </div>
</div>

// builds one stair / ramp gait. The walk solver, on terrain: the loaded foot does not move, its contact point (heel or
// ball, whichever is closer to the surface under it) stays on the tread or ramp, and the body height follows.
function buildStair(R){
  const TAU=Math.PI*2, D2R=Math.PI/180, mod1=x=>x-Math.floor(x);
  const rot=(v,a)=>[v[0]*Math.cos(a)-v[1]*Math.sin(a), v[0]*Math.sin(a)+v[1]*Math.cos(a)];

    return f=>{ let v=a[0]; for(let k=1;k<=K;k++){ v+=a[k]*Math.cos(TAU*k*f)+b[k]*Math.sin(TAU*k*f);} return v; }; }
  const C={}; for(const k in R.legs) C[k]=fit(R.legs[k].slice(0,100),12);
  // stride fit, as on the walk page: hip excursion is scaled about its mean until the drawn legs cover the measured stride
  const hip0=C.hip_flexion, hm=R.legs.hip_flexion.slice(0,100).reduce((s,v)=>s+v,0)/100; let hipG=1;

  const LT=0.47, LS=0.53, HW=0.17;

    const pr=C.pelvic_rotation(g)*D2R, po=C.pelvic_obliquity(g)*D2R;

  ctx.beginPath(); ctx.moveTo(p0[0]+nx*w0/2,p0[1]+ny*w0/2); ctx.lineTo(p1[0]+nx*w1/2,p1[1]+ny*w1/2); ctx.lineTo(p1[0]-nx*w1/2,p1[1]-ny*w1/2); ctx.lineTo(p0[0]-nx*w0/2,p0[1]-ny*w0/2); ctx.closePath(); ctx.fillStyle=col; ctx.fill(); }
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];

function drawLeg(ctx, L, C, far){
  const pant = far?C.pantD:C.pant, skin = far?C.skinD:C.skin, shoe=far?C.shoeD:C.shoe;
  const cuff = lerp(L.knee, L.ankle, 0.9);
  seg(ctx,[cuff,[L.ankle[0],L.ankle[1]+0.005]],0.058,skin,"round");
  // shoe in foot frame
  const sq=1-0.16*EX*L.imp, F=v=>G.shoePt(L.ankle,L.pitch,[v[0]*(1+0.04*EX*L.imp), -0.07+(v[1]+0.07)*sq],L.fy,G.K);
  smooth(ctx,[[-0.08,-0.068],[0.21,-0.07],[0.262,-0.06],[0.25,-0.032],[0.19,-0.018],[0.09,0.008],[0.035,0.04],[-0.055,0.035],[-0.085,0.0]].map(F));
  ctx.fillStyle=shoe; ctx.fill();
  smooth(ctx,[[-0.085,-0.07],[0.24,-0.07],[0.262,-0.06],[0.255,-0.053],[-0.085,-0.054]].map(F));
  ctx.fillStyle=C.sole; ctx.fill();
  // pants: thigh + shin as two strokes, knee rounded
  disc(ctx,L.hip,0.12,pant);
  taper(ctx,L.hip,L.knee,0.24,0.16,pant);            // thigh girth ≈0.25 at the top (ANSUR), knee ≈0.15          // thigh: full at the hip, narrower at the knee
  disc(ctx,L.knee,0.08,pant);
  taper(ctx,L.knee,cuff,0.16,0.145,pant);
}
function drawArm(ctx, A, P, C, far){
  const skin=far?C.skinD:C.skin, shirt=far?C.shirtD:C.shirt;
  disc(ctx,A.sh,0.07,skin); taper(ctx,A.sh,A.el,0.14,0.1,skin); disc(ctx,A.el,0.049,skin); taper(ctx,A.el,A.wr,0.1,0.072,skin);   // ANSUR girths: upper arm ≈0.13, forearm ≈0.11, wrist ≈0.07
  const fd=[Math.sin(A.fa),-Math.cos(A.fa)];
  disc(ctx,[A.wr[0]+fd[0]*0.055,A.wr[1]+fd[1]*0.055],0.06,skin);
  if(!far){ const k=[A.wr[0]+fd[0]*0.03-Math.cos(A.fa)*0.02, A.wr[1]+fd[1]*0.03-Math.sin(A.fa)*0.02];
    seg(ctx,[k,[k[0]+fd[0]*0.025,k[1]+fd[1]*0.025]],0.008,C.skinDD,"round"); }
  // sleeve
  const ax=[Math.sin(A.ua),-Math.cos(A.ua)], n=[Math.cos(A.ua),Math.sin(A.ua)];
  const S=A.sh, p=(u,v)=>[S[0]+ax[0]*u+n[0]*v, S[1]+ax[1]*u+n[1]*v];
  smooth(ctx,[p(-0.07,0.035),p(-0.02,0.09),p(0.18,0.085),p(0.185,-0.078),p(0.02,-0.095),p(-0.08,-0.055)]);
  ctx.fillStyle=shirt; ctx.fill();
  if(!far){ seg(ctx,[p(0.178,0.065),p(0.182,-0.06)],0.012,C.shirtDD,"round"); }
}
function drawFigure(ctx, Q, C){
  drawArm(ctx, Q.arms[1], Q, C, true);
  drawLeg(ctx, Q.legs[1], C, true);
  drawLeg(ctx, Q.legs[0], C, false);
  // pelvis: one rounded block inside the shirt's width — seat at the back, crotch line at the front
  { const T=Q.T, pts=[[-0.162,0.05],[0.148,0.05],[0.15,-0.03],[0.115,-0.095],[0.03,-0.125],[-0.08,-0.115],[-0.158,-0.07],[-0.172,0.0]].map(v=>T(v[0],v[1]));
    smooth(ctx,pts); ctx.fillStyle=C.pant; ctx.fill(); }
  // torso outline built from landmarks: spine curve × thickness profile, shoulder girdle, hem pushed by thighs
  const T=Q.T, hm=Q.hem, sd=Q.shD, w=u=>ss((u-0.4)/0.2)*(1-ss((u-0.64)/0.08));
  // scapula glides over the back of the ribcage: the back follows the shoulder girdle a little, the sternum/chest front does not
  const P=(r,u)=>{ const p=T(r,u), k=w(u), kb=k*Math.max(0,Math.min(1,-r/0.12))*0.6; return [p[0]+sd[0]*kb, p[1]+sd[1]*kb*0.5]; };
  const front=[[0.0,0.145+Q.pushF],[0.1,0.142+Q.pushF*0.35],[0.25,0.14],[0.42,0.146],[0.53,0.144],[0.62,0.122],[0.67,0.092]];   // lean build in a fitted tee (≈0.135 H deep), tapering to the neck
  const back=[[0.756,-0.118],[0.72,-0.142],[0.66,-0.158],[0.56,-0.165],[0.42,-0.16],[0.3,-0.148],[0.18,-0.142],[0.06,-0.155],[0.0,-0.165-Q.pushB]];
  const body=[];
  body.push(P(-0.165-0.4*Math.abs(hm)-Q.pushB, hm*1.5));
  for(const [u,rr] of front) body.push(P(rr, u + (u<0.05? hm*0.7+Q.pushF*0.5 : 0)));
  body.push(P(0.075,0.69)); body.push(P(-0.02,0.732));   // front neckline at the sternal notch, collar rising to C7
  for(const [u,rr] of back) body.push(P(rr, u + (u<0.05? hm*1.2 : 0)));
  smooth(ctx,body); ctx.fillStyle=C.shirt; ctx.fill();
  ctx.save(); smooth(ctx,body); ctx.clip();
  ctx.beginPath(); [P(-0.45,-0.12),P(Q.shade+0.01,-0.12),P(Q.shade-0.01,0.25),P(Q.shade-0.03,0.5),P(Q.shade-0.05,0.85),P(-0.45,0.85)].forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  ctx.closePath(); ctx.fillStyle=C.shirtD; ctx.fill();
  // fold where the shirt drapes over the forward thigh
  if(Q.pushF>0.01){ const a=P(0.12,0.02), b=P(0.06,0.14); seg(ctx,[a,b],0.012,C.shirtD,"round"); }
  ctx.restore();
  // neck: tapered column from the base of the neck (behind the collar) forward-up to under the skull and jaw
  { const ha=Q.headAng, Hd=Q.head, hp=(x,y)=>[Hd[0]+x*Math.cos(ha)-y*Math.sin(ha), Hd[1]+x*Math.sin(ha)+y*Math.cos(ha)];
    // inside back of the collar (fabric seen behind the neck)
    smooth(ctx,[P(-0.125,0.76),P(-0.07,0.775),P(0.02,0.735),P(-0.03,0.725)]); ctx.fillStyle=C.shirtDD; ctx.fill();
    const nb=P(-0.115,0.752), nf=P(0.07,0.692), tb=hp(-0.075,-0.045), tf=hp(0.035,-0.105);   // thick, near-vertical column (reference: depth ≈0.2 incl. trapezius)   // neck depth ≈0.17 at the base (ANSUR neck base circumference)
    smooth(ctx,[nb,lerp(nb,tb,0.5),tb,hp(-0.005,-0.1),tf,lerp(tf,nf,0.5),nf,P(-0.01,0.72)]); ctx.fillStyle=C.skin; ctx.fill();
    // soft shade under the jaw
    smooth(ctx,[hp(-0.015,-0.098),hp(0.035,-0.108),hp(0.02,-0.122),hp(-0.01,-0.118)]); ctx.fillStyle=C.skinD; ctx.fill();
    // rib collar: a band running from high at the back of the neck down to the sternal notch
    const c0=P(-0.125,0.76), cm=P(-0.02,0.738), c1=P(0.078,0.69);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(cm[0],cm[1],c1[0],c1[1]);
    ctx.lineWidth=0.026; ctx.strokeStyle=C.shirt; ctx.lineCap="round"; ctx.stroke();
    ctx.lineWidth=0.007; ctx.strokeStyle=C.shirtDD; ctx.stroke();
  }
  drawHead(ctx,Q,C);
  drawArm(ctx, Q.arms[0], Q, C, false);
}
function drawHead(ctx,Q,C){
  ctx.save(); ctx.translate(Q.head[0],Q.head[1]); ctx.rotate(Q.headAng);
  ctx.beginPath(); ctx.ellipse(0,0.005,0.112,0.135,0,0,Math.PI*2); ctx.fillStyle=C.skin; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.035,-0.06,0.08,0.065,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.035,-0.005,0.025,0.033,0,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill();
  // nose
  ctx.beginPath(); ctx.moveTo(0.108,0.015); ctx.quadraticCurveTo(0.14,-0.02,0.112,-0.03); ctx.fillStyle=C.skin; ctx.fill();
  // face
  // expression (FACS): happy = AU6 cheek raiser + AU12 lip-corner puller; sad = AU1+AU4 inner brow up/together + AU15 lip-corner depressor + drooping lid
  const E=expr(), hap=Math.max(0,E), sad=Math.max(0,-E);
  if(hap>0.01){ ctx.globalAlpha=hap*0.55; ctx.beginPath(); ctx.ellipse(0.062,-0.03,0.026,0.018,0.2,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill(); ctx.globalAlpha=1; }  // raised cheek
  const ry=0.011*Math.max(0.12,Q.eye)*(1-0.35*hap-0.4*sad);
  ctx.beginPath(); ctx.ellipse(0.075,0.02-0.002*hap,0.011,ry,0,0,Math.PI*2); ctx.fillStyle=C.face; ctx.fill();
  if(sad>0.01) seg(ctx,[[0.062,0.03+0.0],[0.088,0.026]],0.006*sad,C.face,"round");                       // heavy upper lid
  if(hap>0.01){ ctx.beginPath(); ctx.moveTo(0.062,0.006); ctx.quadraticCurveTo(0.076,0.0,0.09,0.008); ctx.lineWidth=0.005*hap; ctx.strokeStyle=C.skinDD; ctx.stroke(); } // lower lid pushed up
  // brow: front end is the inner (medial) end in profile
  seg(ctx,[[0.05,0.052+0.006*hap-0.004*sad],[0.098,0.046+0.008*hap+0.016*sad]],0.009,C.face,"round");
  // mouth: corner at the back, lips at the front
  { const m=hap-sad, c0=[0.066,-0.067+0.014*m], c1=[0.1,-0.066];
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(0.083,-0.069-0.008*m,c1[0],c1[1]); ctx.lineWidth=0.007; ctx.strokeStyle=C.face; ctx.lineCap="round"; ctx.stroke(); }
  // hair cap + quiff (quiff swings with vertical acceleration)
  smooth(ctx,[[0.11,0.06],[0.09,0.13],[0.0,0.16],[-0.1,0.13],[-0.128,0.05],[-0.105,0.0],[-0.07,0.02],[-0.05,0.055],[0.04,0.07]]);   // hairline above the nape
  ctx.fillStyle=C.hair; ctx.fill();
  ctx.save(); ctx.translate(0.0,0.13); ctx.rotate(Q.hair);
  smooth(ctx,[[-0.08,0.0],[-0.02,0.11],[0.09,0.16],[0.15,0.1],[0.13,0.03],[0.07,-0.02]]); ctx.fill();
  ctx.restore();
  ctx.restore();
}

// ---------- stage ----------
const cv=document.getElementById("stage"), ctx=cv.getContext("2d");
const sc=document.createElement("canvas"), sx=sc.getContext("2d");     // shadow silhouette
const mk=document.createElement("canvas"), mx=mk.getContext("2d");     // contact-hardened copy
const sl=document.createElement("canvas"), slx=sl.getContext("2d");    // finished shadow layer
let W=0,H=0,dpr=1,S=100,cx=0,gy=0,gyA=0;
const KX=-0.62, KY=0.2;            // shadow shear (light high, in front and to the right of the walker)
let BAND=0.09;                     // half the visible depth of a tread top, leg lengths
let hasFilter=false;
try{ ctx.filter="blur(2px)"; hasFilter = ctx.filter==="blur(2px)"; ctx.filter="none"; }catch(e){}

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  for(const c of [cv,sc,mk,sl]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  S=Math.min(H*0.22, W*0.24);
  const rr=document.querySelector(".rail").getBoundingClientRect(), railTop=rr.height? rr.top : H;
  gy=Math.min(H*0.66, railTop-0.6*S);   // where the surface under the walker sits on screen
  cx=W*0.48;
}
addEventListener("resize",resize); resize();

let phase=0, playing=true, speed=1, last=performance.now(), fade=0, fadeDir=0, pending=null;
const prints=[];
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) playing=false;

// camera follows the mean progression up / down the slope; the surface under the walker stays at gy
let base=0;   // mean surface height under the reference point (relative), set per condition
function surfBase(){ let s=0; for(let i=0;i<100;i++){ const f=i/100; s+=G.terr(G.STRIDE*f+G.samp(G.X,f))-G.RISE*f; } return s/100; }
const SX=x=>cx+S*x, SY=y=>gyA-S*y;      // relative world → screen (CSS px)

function stairRange(){ const t=travel(), x0=t+(-cx)/S-1, x1=t+(W-cx)/S+1;
  return [Math.floor((x0-G.xb)/G.tread), Math.ceil((x1-G.xb)/G.tread)]; }
function drawTerrain(){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const b=S*BAND, t=travel(), l=lift();
  const top="#f2f2f6", side="#e7e8ee", edge="rgba(31,34,51,.22)", far="rgba(31,34,51,.08)";
  if(G.RAMP){
    const xa=-cx/S-1, xbR=(W-cx)/S+1, ya=terrRel(xa), yb=terrRel(xbR);
    ctx.fillStyle=side; ctx.beginPath(); ctx.moveTo(SX(xa),SY(ya)+b); ctx.lineTo(SX(xbR),SY(yb)+b); ctx.lineTo(SX(xbR),H+10); ctx.lineTo(SX(xa),H+10); ctx.fill();
    ctx.fillStyle=top; ctx.beginPath(); ctx.moveTo(SX(xa),SY(ya)-b); ctx.lineTo(SX(xbR),SY(yb)-b); ctx.lineTo(SX(xbR),SY(yb)+b); ctx.lineTo(SX(xa),SY(ya)+b); ctx.fill();
    seg(ctx,[[SX(xa),SY(ya)+b],[SX(xbR),SY(yb)+b]],1.5,edge,"butt"); seg(ctx,[[SX(xa),SY(ya)-b],[SX(xbR),SY(yb)-b]],1,far,"butt");
    // marks every half leg length, fixed in the world
    for(let k=Math.floor((t+xa)/0.5); k<=Math.ceil((t+xbR)/0.5); k++){ const x=k*0.5-t, y=terrRel(x);
      ctx.fillStyle="rgba(31,34,51,.12)"; ctx.fillRect(SX(x),SY(y)+b+S*0.03,Math.max(1.5,S*0.04),1.5); }
  } else {
    const [k0,k1]=stairRange();
    for(let k=k0;k<=k1;k++){ const x0=G.xb+k*G.tread-t, x1=x0+G.tread, y=G.UP*G.riser*k-l, xs0=SX(x0), xs1=SX(x1), ys=SY(y);
      ctx.fillStyle=side; ctx.fillRect(xs0,ys+b,xs1-xs0+0.5,H+10-(ys+b));
      ctx.fillStyle=top; ctx.fillRect(xs0,ys-b,xs1-xs0+0.5,2*b);
      seg(ctx,[[xs0,ys+b],[xs1,ys+b]],1.5,edge,"butt"); seg(ctx,[[xs0,ys-b],[xs1,ys-b]],1,far,"butt");
      // the riser between this tread and the next one, seen edge-on: a short vertical line on the near side
      const yn=SY(y+G.UP*G.riser), xr=xs1;
      seg(ctx,[[xr,Math.min(ys,yn)+b],[xr,Math.max(ys,yn)+b]],1.5,edge,"butt");
      seg(ctx,[[xr,Math.min(ys,yn)-b],[xr,Math.max(ys,yn)-b]],1,far,"butt");
    }
  }
  // footprints: where each foot was planted, fading over ~3 s
  for(let i=prints.length-1;i>=0;i--){ const p=prints[i], age=simT-p.t;
    if(age>3.2){ prints.splice(i,1); continue; }
    const x=SX(p.x-t), y=SY(p.y-l)+S*(p.near?0.022:-0.004), a=0.11*(1-age/3.2)*(p.near?1:0.6);
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.beginPath(); ctx.ellipse(x+S*0.085,y,S*0.17,S*0.016,0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function shoeLow(L){ let m=9;   // lowest sole point above the surface under it
  for(const v of [[-0.085,-0.07],[0.17,-0.07],[0.255,-0.07]]){ const p=G.shoePt(L.ankle,L.pitch,v,L.fy,G.K); m=Math.min(m,p[1]-terrRel(p[0])); } return Math.max(0,m); }

function drawShadow(Q){
  // 1) silhouette projected onto the surface plane through the reference point (affine planar projection)
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  const c0=terrRel(0), k=G.K;   // ramp: plane y = c0 + k·x; stairs: each tread is drawn below as a shifted copy
  if(G.RAMP) sx.setTransform(dpr*S*(1-KX*k), -dpr*S*k*(1+KY), dpr*S*KX, dpr*S*KY, dpr*(cx-S*KX*c0), dpr*(gyA-S*c0*(1+KY)));
  else sx.setTransform(dpr*S,0,dpr*S*KX,dpr*S*KY,dpr*cx,dpr*gyA);
  drawFigure(sx,Q,SHADOW);
  // 2) contact-hardening: sharp copy masked to fade with distance from the feet
  const fx=cx+S*(Q.legs[0].ankle[0]+Q.legs[1].ankle[0])/2, fyS=SY(Math.min(Q.legs[0].fy,Q.legs[1].fy));
  mx.setTransform(1,0,0,1,0,0); mx.globalCompositeOperation="source-over"; mx.clearRect(0,0,mk.width,mk.height);
  mx.drawImage(sc,0,0); mx.globalCompositeOperation="destination-in";
  const g=mx.createRadialGradient(dpr*fx,dpr*fyS,0,dpr*fx,dpr*fyS,dpr*S*1.4);
  g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.35,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  mx.fillStyle=g; mx.fillRect(0,0,mk.width,mk.height); mx.globalCompositeOperation="source-over";
  slx.setTransform(1,0,0,1,0,0); slx.clearRect(0,0,sl.width,sl.height);
  if(hasFilter){ slx.filter=`blur(${(S*0.045*dpr).toFixed(1)}px)`; slx.globalAlpha=0.2; slx.drawImage(sc,0,0); slx.filter="none"; }
  else { slx.globalAlpha=0.15; slx.drawImage(sc,0,0); }
  slx.globalAlpha=0.16; slx.drawImage(mk,0,0); slx.globalAlpha=1;
  // 3) onto the visible top of the ramp / of each tread (a plane at height h is the plane-0 shadow moved by −h)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  const b=S*BAND;
  if(G.RAMP){ const xa=-cx/S-1, xbR=(W-cx)/S+1;
    ctx.beginPath(); ctx.moveTo(dpr*SX(xa),dpr*(SY(terrRel(xa))-b)); ctx.lineTo(dpr*SX(xbR),dpr*(SY(terrRel(xbR))-b));
    ctx.lineTo(dpr*SX(xbR),dpr*(SY(terrRel(xbR))+b)); ctx.lineTo(dpr*SX(xa),dpr*(SY(terrRel(xa))+b)); ctx.clip(); ctx.drawImage(sl,0,0); }
  else { const [k0,k1]=stairRange(), t=travel(), l=lift();
    for(let k=k0;k<=k1;k++){ const x0=G.xb+k*G.tread-t, h=G.UP*G.riser*k-l;
      if(x0>3||x0+G.tread<-3) continue;
      ctx.save(); ctx.beginPath(); ctx.rect(dpr*SX(x0),dpr*(SY(h)-b),dpr*S*G.tread,dpr*2*b); ctx.clip();
      ctx.drawImage(sl,-dpr*S*KX*h,-dpr*S*h*(1+KY)); ctx.restore(); } }
  ctx.restore();
}
function drawContact(Q){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  // per-foot contact shadow on the surface under the ball: tight & dark when planted, soft & faint as the foot lifts
  for(const L of Q.legs){
    const h=shoeLow(L), r=G.rot([0.09,0],L.pitch), x=L.ankle[0]+r[0];
    const a=0.30*Math.exp(-h/0.05), w=S*(0.2+h*1.4)*(1+0.25*EX*L.imp), hh=S*(0.022+h*0.25);
    const g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(30,28,48,${a.toFixed(3)})`); g.addColorStop(1,"rgba(30,28,48,0)");
    ctx.save(); ctx.translate(SX(x),SY(terrRel(x))+S*0.004); ctx.scale(w,hh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
function drawSkeleton(Q){
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gyA);
  const w=1.6/S;
  // right ankle path over the current cycle, in the world (one step over the next tread or along the ramp)
  ctx.strokeStyle="rgba(255,90,54,.55)"; ctx.lineWidth=w; ctx.setLineDash([4/S,4/S]);
  const c0=Math.floor(cyc);
  ctx.beginPath(); for(let i=0;i<=160;i++){ const f=i/160, L=G.leg(f), x=(c0+f)*G.STRIDE+Xb(f)+L.ankle[0]-travel(), y=(c0+f)*G.RISE+hipYb(f)+L.ankle[1]-lift();
    i?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
  ctx.setLineDash([]);
  for(const [i,L] of Q.legs.entries()){ seg(ctx,[L.hip,L.knee,L.ankle],w*2,i?"rgba(255,90,54,.5)":"#ff5a36","round");
    disc(ctx,L.knee,0.018,"#ff5a36"); disc(ctx,L.ankle,0.015,"#ff5a36"); }
  for(const A of Q.arms){ seg(ctx,[A.sh,A.el,A.wr],w*1.6,"rgba(255,90,54,.7)","round"); }
  seg(ctx,[Q.pelvis,Q.neck],w*2,"#ff5a36","round");
  disc(ctx,Q.pelvis,0.024,"#1f2233");
  ctx.restore();
}

// ---------- UI ----------
const chips=[...document.querySelectorAll(".chip")], fr=document.getElementById("fr");
const playBtn=document.getElementById("play"), ico=document.getElementById("ico");
const spd=document.getElementById("spd"), spdo=document.getElementById("spdo"), skel=document.getElementById("skel");
function setPlay(p){ playing=p; playBtn.setAttribute("aria-label",p?"暫停":"播放");
  ico.innerHTML = p? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>' : '<path d="M3 1 L13 7 L3 13 Z"/>'; last=performance.now(); }
playBtn.onclick=()=>setPlay(!playing);
spd.oninput=()=>{ speed=+spd.value; spdo.textContent=speed.toFixed(2)+"×"; };
addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); setPlay(!playing);} });
let lastKey="", lastFr=-1;
function phaseName(g){   // right leg's own phase
  return g<G.ST-0.5 ? "contact" : g<G.ST-0.07 ? "mid" : g<G.ST+0.03 ? "toeoff" : "swing"; }
function updateUI(){
  const k=phaseName(G.mod1(phase));
  if(k!==lastKey){ chips.forEach(c=>c.classList.toggle("on",c.dataset.k===k)); lastKey=k; }
  const n=Math.floor(phase*24)%24+1; if(n!==lastFr){ fr.textContent=String(n).padStart(2,"0"); lastFr=n; }
}
if(reduce) setPlay(false);

const HSTEP=1/240; let accum=0;
function advance(dt){   // fixed-step simulation: phase, progression and springs move together
  accum+=dt;
  while(accum>=HSTEP){ accum-=HSTEP; simT+=HSTEP;
    const cad=1+0.015*(0.6*Math.sin(TAU*simT/7.3)+0.4*Math.sin(TAU*simT/3.1+1));   // stride-to-stride variability
    const d=HSTEP*cad*D.cad/120; phase=G.mod1(phase+d); cyc+=d;                   // cadence in steps/min → strides/s
    breathT+=HSTEP/3.8;
    for(const [i,off] of [[0,0],[1,0.5]]){ const g=G.mod1(phase+off), gp=G.mod1(phase+off-d);
      if(gp<0.12 && g>=0.12){ const L=legAt(i,phase); prints.push({x:travel()+L.A[0], y:lift()+L.fy, t:simT, near:i===0}); } }
    compose(kin(phase), true, HSTEP);
    if(simT>blinkAt+0.2) blinkAt=simT+2+Math.random()*3.5;
  } }
const sty=document.getElementById("sty");
sty.oninput=()=>{ EX=+sty.value; };
const NAMES={stair_ascent:"上樓",stair_descent:"下樓",ramp_ascent:"上坡",ramp_descent:"下坡"};
let mode="stair_ascent";
const modeBtns=[...document.querySelectorAll(".mode")], condBox=document.getElementById("conds"), src=document.getElementById("src");
function condLabel(k){ const s=STAIRS[k]; return s.mode==="stair" ? `${s.cond}″ ${(s.riser_m*100).toFixed(0)} cm` : `${s.cond}°`; }
function buildCondButtons(){
  condBox.innerHTML="";
  for(const k of CONDS.filter(k=>k.startsWith(mode+"_"))){ const b=document.createElement("button");
    b.className="style"; b.dataset.c=k; b.textContent=condLabel(k); b.setAttribute("aria-pressed",k===cond);
    b.onclick=()=>setCond(k); condBox.appendChild(b); } }
function setSrc(){ const s=D, step=s.mode==="stair" ? `踏面 ${(s.tread_m*100).toFixed(0)} × 階高 ${(s.riser_m*100).toFixed(1)} cm` : `坡度 ${s.cond}°`;
  src.textContent = `腿：${s.subjects} 位受試者、${s.cycles} 個穩態步週期（Camargo 2021）　${NAMES[s.mode+"_"+s.dir]} ${step}　${Math.round(s.cad)} 步/分　站立 ${(s.stance*100).toFixed(0)}%　步幅 ${s.stride.toFixed(2)}×腿長　軀幹前傾 ${s.lean>=0?"+":""}${s.lean.toFixed(1)}°`; }
function applyCond(k){ cond=k; G=gait(k); D=STAIRS[k]; cyc=phase; base=surfBase(); prints.length=0;
  gyA=gy+S*base; setSrc();
  condBox.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.c===k)); }
function setCond(k, now){
  if(k===cond && !pending) return;
  if(now||reduce){ applyCond(k); return; }
  pending=k; fadeDir=1;                                          // fade out, swap the terrain, fade back in
}
function setMode(m, now){ mode=m; modeBtns.forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  const same=cond.replace(/^[a-z]+_[a-z]+_/,""), ks=CONDS.filter(k=>k.startsWith(m+"_"));
  const k=ks.find(k=>k.endsWith("_"+same)) || ks[Math.min(2,ks.length-1)];
  buildCondButtons(); setCond(k, now); }
modeBtns.forEach(b=>b.onclick=()=>setMode(b.dataset.m));
phase=0.3; buildCondButtons(); applyCond(cond);
addEventListener("resize",()=>{ gyA=gy+S*base; });
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing) advance(dt*speed);
  if(fadeDir){ fade+=fadeDir*dt/0.18;
    if(fade>=1){ fade=1; fadeDir=-1; if(pending){ applyCond(pending); pending=null; } }
    if(fade<=0){ fade=0; fadeDir=0; } }
  const Q=pose(phase);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  drawTerrain(); drawShadow(Q); drawContact(Q);
  ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gyA);
  drawFigure(ctx,Q,PAL);
  if(skel.checked) drawSkeleton(Q);
  if(fade>0){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=`rgba(255,255,255,${fade.toFixed(3)})`; ctx.fillRect(0,0,cv.width,cv.height); }
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
