/* Layout: one full-bleed white stage; title floats top-left, a single control rail sits at the bottom. */
:root{
  --paper:#ffffff;
  --ink:#1f2233;
  --muted:#8a8c9c;
  --rail:#f3f3f6;
  --line:#e4e4ea;
  --accent:#ff5a36;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);overflow:hidden}
#wrap{position:relative;height:100%;width:100%}

.rail{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));

button{font:inherit;cursor:pointer}
#play{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center}
#play:focus-visible,.chip:focus-visible,input:focus-visible+span,#skel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#play svg{width:14px;height:14px;fill:currentColor}
.speed{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

.phases{display:flex;gap:4px}

.styles{display:flex;gap:4px;background:var(--paper);border-radius:10px;padding:3px}
.style{border:0;background:transparent;color:var(--muted);font-family:var(--body);font-size:13px;padding:6px 11px;border-radius:8px}

.style:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header p.nav{display:block;margin-top:8px;pointer-events:auto}

<div id="wrap">
  <canvas id="stage" aria-label="程序化安靜站立動畫"></canvas>
  <header>
    <h1>Quiet Standing Study</h1>
    <p>站著不動也一直在晃：59 位健康年輕人在測力板上站 60 秒的壓力中心（COP）實測頻譜，經倒單擺換算成質心（COM）擺動，整個身體以踝關節為支點前後擺動，雙腳完全不動。呼吸每分鐘 14 次。</p>

  ctx.closePath(); ctx.fillStyle=C.shirtD; ctx.fill();
  // fold where the shirt drapes over the forward thigh
  if(Q.pushF>0.01){ const a=P(0.12,0.02), b=P(0.06,0.14); seg(ctx,[a,b],0.012,C.shirtD,"round"); }
  ctx.restore();
  // neck: tapered column from the base of the neck (behind the collar) forward-up to under the skull and jaw
  { const ha=Q.headAng, Hd=Q.head, hk=BODY.head, hp=(x,y)=>[Hd[0]+(x*Math.cos(ha)-y*Math.sin(ha))*hk, Hd[1]+(x*Math.sin(ha)+y*Math.cos(ha))*hk];
    // inside back of the collar (fabric seen behind the neck)
    smooth(ctx,[P(-0.125,0.76),P(-0.07,0.775),P(0.02,0.712),P(-0.03,0.705)]); ctx.fillStyle=C.shirtDD; ctx.fill();
    const nb=P(-0.115,0.752), nf=P(0.07,0.662), tb=hp(-0.062,-0.045), tf=hp(0.035,-0.105);   // thick, near-vertical column (reference: depth ≈0.2 incl. trapezius)   // neck depth ≈0.17 at the base, ≈0.16 mid-neck (ANSUR II neck circumferences / π)
    smooth(ctx,[nb,lerp(nb,tb,0.5),tb,hp(-0.005,-0.1),tf,lerp(tf,nf,0.5),nf,P(-0.01,0.7)]); ctx.fillStyle=C.skin; ctx.fill();
    // soft shade under the jaw
    smooth(ctx,[hp(-0.015,-0.098),hp(0.035,-0.108),hp(0.02,-0.122),hp(-0.01,-0.118)]); ctx.fillStyle=C.skinD; ctx.fill();
    // rib collar: a band running from high at the back of the neck down to the sternal notch
    const c0=P(-0.125,0.76), cm=P(-0.02,0.722), c1=P(0.078,0.66);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(cm[0],cm[1],c1[0],c1[1]);
    ctx.lineWidth=0.026; ctx.strokeStyle=C.shirt; ctx.lineCap="round"; ctx.stroke();
    ctx.lineWidth=0.007; ctx.strokeStyle=C.shirtDD; ctx.stroke();
  }
  drawHead(ctx,Q,C);
  drawArm(ctx, Q.arms[0], Q, C, false);
}
function drawHead(ctx,Q,C){
  ctx.save(); ctx.translate(Q.head[0],Q.head[1]); ctx.rotate(Q.headAng); ctx.scale(BODY.head,BODY.head);
  ctx.beginPath(); ctx.ellipse(0,0.005,0.112,0.135,0,0,Math.PI*2); ctx.fillStyle=C.skin; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0.035,-0.06,0.08,0.065,0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.035,-0.005,0.025,0.033,0,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill();
  // nose
  ctx.beginPath(); ctx.moveTo(0.108,0.015); ctx.quadraticCurveTo(0.14,-0.02,0.112,-0.03); ctx.fillStyle=C.skin; ctx.fill();
  // face
  // expression (FACS): happy = AU6 cheek raiser + AU12 lip-corner puller; sad = AU1+AU4 inner brow up/together + AU15 lip-corner depressor + drooping lid
  const E=expr(), hap=Math.max(0,E), sad=Math.max(0,-E);
  if(hap>0.01){ ctx.globalAlpha=hap*0.55; ctx.beginPath(); ctx.ellipse(0.062,-0.03,0.026,0.018,0.2,0,Math.PI*2); ctx.fillStyle=C.skinD; ctx.fill(); ctx.globalAlpha=1; }  // raised cheek
  const ry=0.011*Math.max(0.12,Q.eye)*(1-0.35*hap-0.4*sad);
  ctx.beginPath(); ctx.ellipse(0.075,0.02-0.002*hap,0.011,ry,0,0,Math.PI*2); ctx.fillStyle=C.face; ctx.fill();
  if(sad>0.01) seg(ctx,[[0.062,0.03+0.0],[0.088,0.026]],0.006*sad,C.face,"round");                       // heavy upper lid
  if(hap>0.01){ ctx.beginPath(); ctx.moveTo(0.062,0.006); ctx.quadraticCurveTo(0.076,0.0,0.09,0.008); ctx.lineWidth=0.005*hap; ctx.strokeStyle=C.skinDD; ctx.stroke(); } // lower lid pushed up
  // brow: front end is the inner (medial) end in profile
  seg(ctx,[[0.05,0.052+0.006*hap-0.004*sad],[0.098,0.046+0.008*hap+0.016*sad]],0.009,C.face,"round");
  // mouth: corner at the back, lips at the front
  { const m=hap-sad, c0=[0.066,-0.067+0.014*m], c1=[0.1,-0.066];
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.quadraticCurveTo(0.083,-0.069-0.008*m,c1[0],c1[1]); ctx.lineWidth=0.007; ctx.strokeStyle=C.face; ctx.lineCap="round"; ctx.stroke(); }
  // hair cap + quiff (quiff swings with vertical acceleration)
  smooth(ctx,[[0.11,0.06],[0.09,0.135],[0,0.168],[-0.1,0.135],[-0.128,0.05],[-0.105,0],[-0.07,0.02],[-0.05,0.055],[0.04,0.07]]);   // hairline above the nape; ≈2 cm of volume over the crown
  ctx.fillStyle=C.hair; ctx.fill();
  ctx.save(); ctx.translate(0.0,0.125); ctx.rotate(Q.hair);
  smooth(ctx,[[-0.07,0],[-0.02,0.04],[0.05,0.065],[0.115,0.055],[0.13,0.02],[0.11,-0.025],[0.06,-0.04]]); ctx.fill();   // short quiff: top ≈4 cm above the skull
  ctx.restore();
  ctx.restore();
}

// ---------- stage ----------
const cv=document.getElementById("stage"), ctx=cv.getContext("2d");
const sc=document.createElement("canvas"), sx=sc.getContext("2d");
const mk=document.createElement("canvas"), mx=mk.getContext("2d");
const lo=document.createElement("canvas"), lx=lo.getContext("2d");
let W=0,H=0,dpr=1,S=100,cx=0,gy=0;
let KX=-0.62, KY=0.2, SH_A=1, SH_BLUR=1;   // shadow shear, darkness and softness (recomputed on resize)
// a point light hangs over the middle of the stage (height LH, a little behind the body's plane), as in the walk's fixed camera
const LH=4.2, LZ=0.75;
function updateLight(){
  const dx=(cx-W/2)/S, yRef=1.05;
  KX=dx/(LH-yRef); KY=LZ/(LH-yRef);
  const d=Math.hypot(dx,LH), c=LH/d;
  SH_A=Math.pow(c,3);                                    // irradiance ∝ cosθ/d²  → blocked light ∝ (h/d)³
  SH_BLUR=1+1.2*Math.abs(KX);
}
let hasFilter=false;
try{ ctx.filter="blur(2px)"; hasFilter = ctx.filter==="blur(2px)"; ctx.filter="none"; }catch(e){}
const traceBox=document.getElementById("trace");
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  W=cv.clientWidth; H=cv.clientHeight;
  for(const c of [cv,sc,mk]){ c.width=Math.round(W*dpr); c.height=Math.round(H*dpr); }
  lo.width=Math.max(1,Math.round(W*dpr/5)); lo.height=Math.max(1,Math.round(H*dpr/5));
  const rr=document.querySelector(".rail").getBoundingClientRect(), railTop=rr.height? rr.top : H;   // keep the feet and shadow above the controls
  S=Math.min(H*0.255, W*0.27);
  traceBox.classList.remove("off"); traceBox.style.top="";
  const hb=document.querySelector("header").getBoundingClientRect().bottom;
  if(W<=720){   // narrow: stabilogram strip under the title, figure (hair top ≈2.3 leg lengths with the ×10 sway, shadow 0.3 below) in the rest
    const top=hb+6, tb=top+traceBox.offsetHeight+14, fit=Math.min((railTop-tb)/2.6, (H*0.74-tb)/2.3);   // gy = min(0.74 H, rail − 0.3 S)
    if(fit>=S){ traceBox.style.top=top+"px"; S=Math.min(H*0.255, W*0.5, fit); }
    else traceBox.classList.add("off"); }
  gy=Math.min(H*0.74, railTop-0.3*S);
  // keep the head clear of the title text: stand to the right of it, or (no room) below it
  const tr=Math.max(0,...[...document.querySelectorAll("header h1, header p:not(.nav), header p.nav > *")].map(e=>{ const g=document.createRange(); g.selectNodeContents(e); const q=g.getBoundingClientRect(); return q.width? q.right : 0; }));
  cx=W*(W>720?0.42:0.5);
  if(gy-2.3*S<hb && tr+12>cx-0.4*S){   // head (with the hair) reaches ≈0.4 S behind cx at ×10
    if(tr+12+0.4*S<=W-0.7*S) cx=tr+12+0.4*S;
    else{ S=Math.min(S,(railTop-hb-10)/2.6,(H*0.74-hb-10)/2.3); gy=Math.min(H*0.74, railTop-0.3*S); } }
  updateLight();
}
addEventListener("resize",resize); resize();
if(document.fonts){ document.fonts.ready.then(resize); document.fonts.addEventListener?.("loadingdone",resize); }   // the title's size (and so the layout) changes once the web fonts arrive

let playing=true, speed=1, last=performance.now();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) playing=false;

function shoeLow(L,pad){ let m=9;
  for(const v of [[-0.085,-0.07],[0.17,-0.07],[0.255,-0.07]]) m=Math.min(m,G.shoePt(L.ankle,L.pitch,v)[1]); return Math.max(0,m-pad); }

function drawShadow(Q){
  // 1) silhouette projected onto the ground plane (affine planar projection)
  sx.setTransform(1,0,0,1,0,0); sx.clearRect(0,0,sc.width,sc.height);
  sx.setTransform(dpr*S,0,dpr*S*KX,dpr*S*KY,dpr*cx,dpr*gy);
  drawFigure(sx,Q,SHADOW);
  // 2) contact-hardening: sharp copy masked to fade with distance from the feet
  mx.setTransform(1,0,0,1,0,0); mx.globalCompositeOperation="source-over"; mx.clearRect(0,0,mk.width,mk.height);
  mx.drawImage(sc,0,0); mx.globalCompositeOperation="destination-in";
  const g=mx.createLinearGradient(dpr*cx,dpr*gy,dpr*(cx+S*KX*1.6),dpr*(gy+S*Math.max(KY,0.2)*1.6));
  g.addColorStop(0,"rgba(0,0,0,1)"); g.addColorStop(0.35,"rgba(0,0,0,.55)"); g.addColorStop(1,"rgba(0,0,0,0)");
  mx.fillStyle=g; mx.fillRect(0,0,mk.width,mk.height); mx.globalCompositeOperation="source-over";
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  if(hasFilter){ ctx.filter=`blur(${(S*0.045*dpr*SH_BLUR).toFixed(1)}px)`; ctx.globalAlpha=0.2*SH_A; ctx.drawImage(sc,0,0); ctx.filter="none"; }
  else { lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,lo.width,lo.height); lx.drawImage(sc,0,0,lo.width,lo.height);
    ctx.imageSmoothingQuality="high"; ctx.globalAlpha=0.15*SH_A; ctx.drawImage(lo,0,0,cv.width,cv.height); }
  ctx.globalAlpha=0.16*SH_A/SH_BLUR; ctx.drawImage(mk,0,0);
  ctx.restore();
}
const PAD_X=[-0.34,0.42];   // foam block under both feet (Airex Balance Pad ≈ 50 × 41 × 6 cm), leg lengths
function drawPad(pad){
  if(pad<=1e-4) return;
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  const x0=STAND_X+PAD_X[0], x1=STAND_X+PAD_X[1], r=Math.min(0.02,pad*0.4);
  ctx.beginPath(); ctx.moveTo(x0,0); ctx.lineTo(x1,0); ctx.lineTo(x1,pad-r); ctx.quadraticCurveTo(x1,pad,x1-r,pad);
  ctx.lineTo(x0+r,pad); ctx.quadraticCurveTo(x0,pad,x0,pad-r); ctx.closePath();
  ctx.fillStyle="#cfd3e6"; ctx.fill();
  ctx.fillStyle="#b9bed6"; ctx.fillRect(x0,0,x1-x0,pad*0.35);                // shaded lower band
  ctx.restore();
}
function drawContact(Q){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  const pad=Q.pad, top=gy-S*pad;
  // broad occlusion under the body (on the floor, or under the pad)
  const bx=cx+S*(Q.legs[0].ankle[0]+0.06-0.05), rw=S*(pad>1e-4?0.5:0.42), rh=S*0.05;
  let g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,"rgba(40,36,60,.10)"); g.addColorStop(1,"rgba(40,36,60,0)");
  ctx.save(); ctx.translate(bx,gy+S*0.006); ctx.scale(rw,rh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  // per-foot contact shadow on the support surface; the feet are planted, so it stays tight and dark
  for(const L of Q.legs){
    const h=shoeLow(L,pad), r=G.rot([0.09,0],L.pitch);
    const x=cx+S*(L.ankle[0]+r[0]), a=0.30*Math.exp(-h/0.05), w=S*(0.2+h*1.4), hh=S*(0.022+h*0.25);
    g=ctx.createRadialGradient(0,0,0,0,0,1); g.addColorStop(0,`rgba(30,28,48,${a.toFixed(3)})`); g.addColorStop(1,"rgba(30,28,48,0)");
    ctx.save(); ctx.translate(x,top+S*0.004); ctx.scale(w,hh); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
  ctx.restore();
}
function drawGround(){
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  // the floor is brightest under the light and falls off as (h/d)³ toward the edges
  const R=Math.max(W,S*8), g=ctx.createRadialGradient(W/2,gy,0,W/2,gy,R);
  for(let i=0;i<=6;i++){ const t=i/6, dx=t*R/S, c=Math.pow(LH/Math.hypot(dx,LH),3); g.addColorStop(t,`rgba(31,34,51,${(0.07*(1-c)).toFixed(4)})`); }
  ctx.save(); ctx.beginPath(); ctx.rect(0,gy-S*0.02,W,H); ctx.clip();   // floor only, never the wall
  ctx.translate(0,gy); ctx.scale(1,0.18); ctx.translate(0,-gy); ctx.fillStyle=g; ctx.fillRect(0,gy-R,W,R*2); ctx.restore();
  const sp=S*0.28, off=((cx%sp)+sp)%sp;
  for(let x=off-sp; x<W+sp; x+=sp){
    const e=Math.min(1, x/(W*0.12), (W-x)/(W*0.12)), a=Math.max(0,e)*0.16;
    ctx.fillStyle=`rgba(31,34,51,${a.toFixed(3)})`;
    ctx.fillRect(x,gy+S*0.035,Math.max(1.5,S*0.04),1.5);
  }
  ctx.restore();
}
function drawSkeleton(Q){
  ctx.save(); ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  const w=1.6/S, A0=Q.A0, com=[A0[0]+HP*Math.sin(Q.th), A0[1]+HP*Math.cos(Q.th)];
  for(const [i,L] of Q.legs.entries()){ seg(ctx,[L.hip,L.knee,L.ankle],w*2,i?"rgba(255,90,54,.5)":"#ff5a36","round");
    disc(ctx,L.knee,0.018,"#ff5a36"); disc(ctx,L.ankle,0.015,"#ff5a36"); }
  for(const A of Q.arms){ seg(ctx,[A.sh,A.el,A.wr],w*1.6,"rgba(255,90,54,.7)","round"); }
  seg(ctx,[Q.pelvis,Q.neck],w*2,"#ff5a36","round");
  disc(ctx,Q.pelvis,0.024,"#1f2233");
  // inverted pendulum: ankle → whole-body COM; below it, the COM's floor projection (grey) and the COP (orange),
  // mean removed and magnified like the body. The COP runs ahead of the COM and keeps pushing it back.
  ctx.strokeStyle="rgba(31,34,51,.5)"; ctx.lineWidth=w; ctx.setLineDash([4/S,4/S]);
  ctx.beginPath(); ctx.moveTo(A0[0],A0[1]); ctx.lineTo(com[0],com[1]); ctx.moveTo(com[0],com[1]); ctx.lineTo(com[0],Q.pad); ctx.stroke(); ctx.setLineDash([]);
  disc(ctx,com,0.03,"#1f2233"); disc(ctx,com,0.014,"#ffffff");
  const cop=A0[0]+MAG*Q.sw.cop[0]/100/LEG;
  disc(ctx,[com[0],Q.pad+0.012],0.014,"rgba(31,34,51,.6)");
  ctx.beginPath(); ctx.moveTo(cop,Q.pad+0.005); ctx.lineTo(cop-0.025,Q.pad+0.05); ctx.lineTo(cop+0.025,Q.pad+0.05); ctx.closePath(); ctx.fillStyle="#ff5a36"; ctx.fill();
  ctx.restore();
}
// stabilogram: last 10 s at true scale; COP thin (accent), COM thick (ink); AP on top, ML below
const TR_N=600, TR=new Float32Array(TR_N*4); let trI=0, trCount=0;
function pushTrace(sw){ TR.set([sw.cop[0],sw.com[0],sw.cop[1],sw.com[1]], trI*4); trI=(trI+1)%TR_N; trCount=Math.min(TR_N,trCount+1); }
function drawTrace(){
  if(getComputedStyle(traceBox).display==="none") return;   // (hidden only on a screen too short for it)
  const r=traceBox.getBoundingClientRect(), half=r.height/2, YC=3;   // ±3 cm
  ctx.save(); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font="500 11px 'IBM Plex Mono', ui-monospace, monospace"; ctx.textBaseline="top";
  for(const [j,label] of [[0,"AP 前後"],[1,"ML 左右"]]){
    const y0=r.top+half*j, yc=y0+half/2+6, k=(half/2-10)/YC;
    ctx.fillStyle="#8a8c9c"; ctx.fillText(label, r.left, y0);
    ctx.strokeStyle="#e4e4ea"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(r.left,yc); ctx.lineTo(r.right,yc); ctx.stroke();
    ctx.save(); ctx.beginPath(); ctx.rect(r.left-2,y0+12,r.width+4,half-12); ctx.clip();   // keep each trace in its band
    for(const [c,col,lw] of [[0,"#ff5a36",1.25],[1,"#1f2233",2]]){
      ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineJoin="round"; ctx.beginPath();
      for(let n=0;n<trCount;n++){ const i=(trI-trCount+n+TR_N)%TR_N, x=r.right-(trCount-1-n)/(TR_N-1)*r.width, y=yc-TR[i*4+j*2+c]*k;
        n?ctx.lineTo(x,y):ctx.moveTo(x,y); }
      ctx.stroke(); }
    ctx.restore();
  }
  ctx.fillStyle="#8a8c9c"; ctx.textAlign="right";
  ctx.fillText(`±${YC} cm · 10 s`, r.right, r.top); ctx.fillStyle="#ff5a36"; ctx.fillText("COP", r.right-96, r.top+half);
  ctx.fillStyle="#1f2233"; ctx.fillText("COM", r.right-62, r.top+half);
  ctx.restore();
}

// ---------- UI ----------
const chips=[...document.querySelectorAll(".chip")], fr=document.getElementById("fr");
const playBtn=document.getElementById("play"), ico=document.getElementById("ico");
const spd=document.getElementById("spd"), spdo=document.getElementById("spdo"), skel=document.getElementById("skel");
function setPlay(p){ playing=p; playBtn.setAttribute("aria-label",p?"暫停":"播放");
  ico.innerHTML = p? '<rect x="2" y="1" width="3.5" height="12"/><rect x="8.5" y="1" width="3.5" height="12"/>' : '<path d="M3 1 L13 7 L3 13 Z"/>'; last=performance.now(); }
playBtn.onclick=()=>setPlay(!playing);
spd.oninput=()=>{ speed=+spd.value; spdo.textContent=speed.toFixed(2)+"×"; };
addEventListener("keydown",e=>{ if(e.code==="Space"&&e.target.tagName!=="INPUT"){ e.preventDefault(); setPlay(!playing);} });
let lastKey="";
function updateUI(Q){
  const k=breathPh<0.4?"in":"out";
  if(k!==lastKey){ chips.forEach(c=>c.classList.toggle("on",c.dataset.k===k)); lastKey=k; }
  fr.textContent=(Q.sw.com[0]>=0?"+":"−")+Math.abs(Q.sw.com[0]).toFixed(2);
}
if(reduce) setPlay(false);

const HSTEP=1/240; let accum=0, sub4=0, brRate=1;
function advance(dt){   // fixed-step simulation: sway clock, breathing and springs move together
  accum+=dt;
  while(accum>=HSTEP){ accum-=HSTEP; simT+=HSTEP;
    // breath-to-breath variability: rate wanders ±8 % around 14 breaths/min
    brRate=1+0.08*(0.6*Math.sin(TAU*simT/23.0)+0.4*Math.sin(TAU*simT/9.7+2));
    breathPh=G.mod1(breathPh+HSTEP*14/60*brRate);
    if(blend<1) blend=Math.min(1,blend+HSTEP/0.9);
    if(MAG!==MAGT){ const l=Math.log(MAG)+(Math.log(MAGT)-Math.log(MAG))*(1-Math.exp(-HSTEP/0.3)); MAG=Math.abs(l-Math.log(MAGT))<1e-4? MAGT : Math.exp(l); }
    const R=kin(simT);
    if(++sub4===4){ sub4=0; pushTrace(R.sw); }     // 60 Hz trace
    compose(R, true, HSTEP);
    if(simT>blinkAt+0.2) blinkAt=simT+2+Math.random()*3.5;
  } }
const styleBtns=[...document.querySelectorAll(".style[data-s]")], src=document.getElementById("src");
function setSrc(k){ const s=STAND.conditions[k];
  src.textContent = `${STAND.subjects} 位健康年輕人（${Math.round(STAND.age[0])}–${Math.round(STAND.age[1])} 歲）× 3 次 60 秒（BDS）${COND_NAMES[k]}：COP 前後 RMS ${s.cop_ap.rms.toFixed(2)} cm　左右 ${s.cop_ml.rms.toFixed(2)} cm　速度 ${s.cop_ap.vel.toFixed(2)} cm/s　質心擺角 ${s.angle_rms_deg.toFixed(2)}°`; }
function setStyle(k){
  setSrc(k);
  if(k===condB && blend>=1) return;
  condA = blend>=0.5 ? condB : condA; condB=k; blend=0;          // cross-fade from whatever is showing
  styleBtns.forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===k));
}
styleBtns.forEach(b=>b.onclick=()=>setStyle(b.dataset.s));
const magBtns=[...document.querySelectorAll(".mag")];
function setMag(m, now){ MAGT=m; if(now) MAG=m; magBtns.forEach(b=>b.setAttribute("aria-pressed", +b.dataset.m===m)); }
magBtns.forEach(b=>b.onclick=()=>setMag(+b.dataset.m));
setStyle("open_firm"); blend=1;
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  if(playing) advance(dt*speed);
  const Q=pose();
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,cv.width,cv.height);
  drawGround(); drawShadow(Q); drawPad(Q.pad); drawContact(Q);
  ctx.setTransform(dpr*S,0,0,-dpr*S,dpr*cx,dpr*gy);
  drawFigure(ctx,Q,PAL);
  if(skel.checked) drawSkeleton(Q);
  drawTrace();
  updateUI(Q);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
